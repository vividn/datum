[kit]
name = "chores"
version = "0.7"
description = "Chores as datum v2 kept them: a chore is any entry whose data says when it is next due (next_date / next_time, or v2's nextDate / nextTime). Log it done with `datum occur <chore> next_date=+7`; shirk it — move the date without claiming it — with `-T`. `datum newchore vacuum 4` declares a chore done every 4 days, so every `datum vacuum` then logs it due four days on; a first due date other than that is a shirk, `datum occur vacuum -T next_date=<date>`. `datum chorelist` shows what is due or was done today, `datum chorelist <chore>` one chore, and `datum chorelist --all` every chore; `--sort due` (or `-due`) sorts by a shown column."

# Every chore query scans only the entries that say when they are next due.
# This partial index's WHERE is exactly the chore CTE's, so SQLite can use it:
# live rows only (not deleted, and not superseded by a sync merge).
[[index]]
name = "chore_rows"
on = "entries"
expression = "field"
where = "deleted_at IS NULL AND superseded_by IS NULL AND (json_type(data, '$.next_time') IS NOT NULL OR json_type(data, '$.nextTime') IS NOT NULL OR json_type(data, '$.next_date') IS NOT NULL OR json_type(data, '$.nextDate') IS NOT NULL)"

# One row per chore field, as v2's `chores` map/reduce reduced it
# (reference: datum-v2 projects/datum/views/chores.ts):
#   · due        — `next` from the LATEST entry by time, where time is
#                  occur_time, or create_time for a shirk (no occur_time).
#                  A JSON null next (v2's cleared nextDate, as v2import
#                  keeps it, or `next_date=null`) hides the chore.
#   · last_occur — the latest occurrence; a shirk never counts as done.
#   · iti        — the interval in days: the chore's declared one, a
#                  `next_date=+N` default in its spec (`newchore`), or
#                  `next_time=+Nh` as N/24. A chore with no spec (v2's)
#                  takes v2's inter-time interval from its latest
#                  occurrence: a date's whole days, or a datetime's exact
#                  days. Equal intervals sort by name.
#   · status     — done (today) · overdue (by more than its iti) · late (by
#                  more than half) · due · '' — v2's colours as a column,
#                  because a command's colour rules and sort see only the
#                  columns it shows.
# «Today» is `local_today()`, datum's own clock and zone: SQLite's own
# local-time modifier gives the UTC day on datum.day, where it has no zone
# data (da-5fonh). A timed chore's due day is its instant in the offset its
# entry was logged with, for the same reason.
# Every key spelling is read: next_date / nextDate a day, next_time /
# nextTime an instant {utc, o, tz} as v2 wrote it and v3 now logs it
# (da-x15of); a next_time logged before that is the text it was.
[[view]]
name = "chores"
sql = """
WITH chore AS (
  SELECT field, occur_time, occur_time_offset,
         COALESCE(occur_time, create_time) AS t,
         COALESCE(json_extract(data, '$.next_time.utc'),
                  json_extract(data, '$.next_time'),
                  json_extract(data, '$.nextTime.utc'),
                  json_extract(data, '$.next_date'),
                  json_extract(data, '$.nextDate'))              AS next,
         CASE WHEN json_extract(data, '$.next_time') IS NOT NULL
                OR json_extract(data, '$.nextTime.utc') IS NOT NULL
              THEN 0 ELSE 1 END                                  AS full_day
  FROM entries
  WHERE deleted_at IS NULL AND superseded_by IS NULL
    AND (json_type(data, '$.next_time') IS NOT NULL
      OR json_type(data, '$.nextTime') IS NOT NULL
      OR json_type(data, '$.next_date') IS NOT NULL
      OR json_type(data, '$.nextDate') IS NOT NULL)
),
spec AS (
  SELECT json_extract(s.data, '$.field')                         AS field,
         MIN(CASE
           WHEN k.value GLOB 'next_date=+*' OR k.value GLOB 'nextDate=+*'
             THEN CAST(substr(k.value, instr(k.value, '=+') + 2) AS REAL)
           WHEN k.value GLOB 'next_time=+*h' OR k.value GLOB 'nextTime=+*h'
             THEN CAST(substr(k.value, instr(k.value, '=+') + 2) AS REAL) / 24
         END)                                                    AS iti
  FROM entries s, json_each(s.data, '$.data_keys') k
  WHERE s.field = 'spec' AND s.deleted_at IS NULL AND s.superseded_by IS NULL
    AND s.slug = 'spec:' || json_extract(s.data, '$.field')
  GROUP BY 1
),
latest AS (
  SELECT *, ROW_NUMBER() OVER (PARTITION BY field ORDER BY t DESC) AS rn
  FROM chore
),
occ AS (
  SELECT *, ROW_NUMBER() OVER (PARTITION BY field ORDER BY occur_time DESC) AS rn
  FROM chore WHERE occur_time IS NOT NULL
),
row AS (
  SELECT l.field                                                   AS field,
         l.next                                                    AS due,
         l.full_day                                                AS full_day,
         o.occur_time                                              AS last_occur,
         COALESCE(sp.iti, CASE
           WHEN o.next IS NULL THEN NULL
           WHEN o.full_day = 1 THEN
             julianday(o.next) - julianday(local_day(o.occur_time, o.occur_time_offset))
           ELSE julianday(o.next) - julianday(o.occur_time)
         END)                                                      AS iti,
         CASE WHEN o.occur_time IS NOT NULL
               AND local_day(o.occur_time, o.occur_time_offset) = local_today()
              THEN 1 ELSE 0 END                                    AS done_today,
         COALESCE(l.occur_time_offset, o.occur_time_offset, 0)     AS due_offset
  FROM latest l LEFT JOIN occ o ON o.field = l.field AND o.rn = 1
                 LEFT JOIN spec sp ON sp.field = l.field
  WHERE l.rn = 1 AND l.next IS NOT NULL
)
SELECT field, due, last_occur, iti,
       CAST(iti AS INTEGER)                                        AS iti_days,
       done_today, is_due, days_overdue,
       CASE WHEN done_today = 1                                THEN 'done'
            WHEN is_due = 1 AND days_overdue > iti             THEN 'overdue'
            WHEN is_due = 1 AND days_overdue > iti / 2.0       THEN 'late'
            WHEN is_due = 1                                    THEN 'due'
            ELSE '' END                                        AS status
FROM (
  SELECT row.*,
         CASE WHEN full_day = 1 THEN due <= local_today()
              ELSE julianday(due) <= julianday('now') END      AS is_due,
         CAST(julianday(local_today())
              - julianday(CASE WHEN full_day = 1 THEN due
                               ELSE date(due, due_offset || ' minutes') END)
              AS INTEGER)                                      AS days_overdue
  FROM row
)
ORDER BY iti IS NULL, iti, field
"""

# What `chorelist` shows, as v2's did without `--show all`: what is due,
# and what was done today (a finished chore stays in view, green). Its
# arguments narrow it to one chore (`:field`) or widen it to every one
# (`--all`, v2's `--show all`, binds `:all` to 1); left unbound, both are
# NULL.
[[view]]
name = "chores_due"
uses = ["chores"]
sql = """
SELECT * FROM chores
WHERE (:field IS NULL OR field = :field)
  AND (:all OR is_due = 1 OR done_today = 1)
ORDER BY iti IS NULL, iti, field
"""

# `datum chorelist` is v2's table: most frequent chores first (the views sort
# by iti, then name), done today in green, overdue by more than its iti in red, by more
# than half of it in yellow. v2's forms: `chorelist`, `chorelist vacuum`,
# and `chorelist --all --sort due` for `chorelist due --show all`.
[[command]]
name = "chorelist"
view = "chores_due"
help = "Chores due now or done today, most frequent first (v2's chorelist); --all shows every chore"
args = ["field="]
switches = ["all"]
columns = ["field", "iti_days", "due", "last_occur", "status"]
labels = { field = "Field", iti_days = "ITI", due = "Due", last_occur = "Last Occur", status = "" }
formats = { due = "smart_date", last_occur = "smart_date" }
flags = ["watch"]
# v2's own words when nothing is due or done today.
empty = "🧹😄 COMPLETED! GOOD WORK! 😄🪣"

[[command.color_rules]]
when = "status = 'done'"
color = "green"

[[command.color_rules]]
when = "status = 'overdue'"
color = "red"

[[command.color_rules]]
when = "status = 'late'"
color = "yellow"

# `datum newchore vacuum 4`: track vacuum as a chore done every 4 days. Its
# spec's `next_date=+4` default is what every `datum vacuum` logs, and the
# interval the `chores` view reads.
[[alias]]
name = "newchore"
expands_to = "track $1 --verb occur -k next_date=+$2"
description = "track a new chore: newchore NAME DAYS"
