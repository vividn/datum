# Every job installs Rust with a bare `rustup toolchain install`, which installs
# the *active* toolchain — and `rust-toolchain.toml` at the repo root overrides
# what that is, along with the components and targets. So the version lives in
# exactly one place, and a local `cargo clippy` uses the same compiler CI does.
#
# dtolnay/rust-toolchain is deliberately not used here: its `toolchain` input is
# required and the action cannot read rust-toolchain.toml, so keeping it would
# mean a second copy of the version, free to drift from the first. Reading
# `@stable` is how main went red on 2026-07-14 with no code change.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # dtolnay/rust-toolchain used to set this for us; stated here so dropping the
  # action doesn't quietly re-enable incremental artifacts in the cache.
  CARGO_INCREMENTAL: 0

jobs:
  build-and-test:
    name: Build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install --no-self-update

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: cargo build --workspace
        run: cargo build --workspace --all-targets

      - name: cargo nextest run --workspace
        run: cargo nextest run --workspace --no-fail-fast

      - name: cargo test --workspace --doc
        run: cargo test --workspace --doc

  e2e-full:
    name: E2E full cohort (da-1wat)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install --no-self-update

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      # The fast cohort is already covered by `build-and-test`. This job
      # extends coverage to the full E2E matrix which is gated behind
      # `--features e2e-full` on `datum-commands` so polecat / refinery
      # sessions don't pay the cost on every push. Add new full-cohort
      # cases here (via `e2e_case!(full, ...)`), not in the main job.
      - name: cargo nextest run --features e2e-full
        run: cargo nextest run -p datum-commands --test e2e --features e2e-full --no-fail-fast

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install --no-self-update

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --all -- --check
        run: cargo fmt --all -- --check

      - name: cargo clippy --workspace --all-targets -- -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

  wasm-check:
    name: WASM check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install --no-self-update

      - name: Add the wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2

      - name: cargo check datum-sync-client (wasm32, --no-default-features --features wasm)
        run: cargo check -p datum-sync-client --target wasm32-unknown-unknown --no-default-features --features wasm

      # The two modules datum.day loads. Their artifacts are committed (the
      # web job has no Rust toolchain), so what this catches is the crates
      # ceasing to build for wasm at all — which is how a stale artifact
      # starts. `npm run build:wasm` rebuilds and re-commits them.
      #
      # `build`, not `check`: the failure mode these have is a *link*-time
      # one. A dependency that reaches for the browser's clock (chrono's
      # `wasmbind`, say) adds a wasm-bindgen import, and a module with
      # imports will not load from the bare `WebAssembly.instantiate` the
      # browser side uses. `cargo check` sees none of that.
      - name: cargo build the browser modules (wasm32)
        run: |
          cargo build -p datum-layout-wasm --target wasm32-unknown-unknown --profile wasm-release
          cargo build -p datum-parse-wasm --target wasm32-unknown-unknown --profile wasm-release --no-default-features

  honesty:
    name: Honesty gates (da-8y2q.7)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install --no-self-update

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2

      # Runs the repo-hygiene gates — the four pre-v1 honesty gates:
      #   - no-cfg-any      — no #[cfg(any())] dead-test trees
      #   - no-r2-stubs     — no `bail!("...stub — R2 extracts...")` shims
      #   - no-legacy-verbs — no Verb::{Occur,Start,Stop,Add} outside migrations
      #   - max-file-size   — no .rs file in crates/ above MAX_FILE_LOC
      # and one anti-drift gate:
      #   - toolchain-pin   — every Dockerfile's `FROM rust:<tag>` agrees with
      #                       rust-toolchain.toml (a stale tag still builds,
      #                       so nothing else would catch it)
      # See `xtask/src/main.rs` for the rules each gate enforces and
      # `scripts/check-honesty.sh` for the same battery as a local hook.
      #
      # `check lint`, not `check all`: this job does not install
      # cargo-nextest, so `check all` would fail at its nextest step. And
      # running it here would duplicate the `lint` and `build-and-test`
      # jobs, which already cover the fmt, clippy, build and test steps
      # `all` adds. `all` is the local one-command mirror of CI; this job
      # is its hygiene quarter.
      - name: cargo xtask check lint
        run: cargo run -q -p xtask -- check lint

  web:
    name: Web (datum.day)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: npm ci
        run: npm ci

      # The suite drives the built app in a real browser, because the
      # `run(argv)` seam's storage is SQLite-wasm on OPFS inside a dedicated
      # worker and that exists nowhere else. Only the headless shell is
      # installed — no headed Chromium, no other engines.
      - name: Install the headless browser
        run: npx playwright install --with-deps --only-shell chromium

      # `pretest` builds the app first; the CLI-parity fixtures under
      # web/tests/fixtures are committed, so this job needs no Rust
      # toolchain. Regenerate them with `npm run test:fixtures` against a
      # built `datum` binary when the CLI's stored shape changes.
      - name: npm test
        run: npm test
