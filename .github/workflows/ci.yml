name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-and-test:
    name: Build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: cargo build --workspace
        run: cargo build --workspace --all-targets

      - name: cargo nextest run --workspace
        run: cargo nextest run --workspace --no-fail-fast

      - name: cargo test --workspace --doc
        run: cargo test --workspace --doc

  e2e-full:
    name: E2E full cohort (da-1wat)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      # The fast cohort is already covered by `build-and-test`. This job
      # extends coverage to the full E2E matrix which is gated behind
      # `--features e2e-full` on `datum-commands` so polecat / refinery
      # sessions don't pay the cost on every push. Add new full-cohort
      # cases here (via `e2e_case!(full, ...)`), not in the main job.
      - name: cargo nextest run --features e2e-full
        run: cargo nextest run -p datum-commands --test e2e --features e2e-full --no-fail-fast

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --all -- --check
        run: cargo fmt --all -- --check

      - name: cargo clippy --workspace --all-targets -- -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings
