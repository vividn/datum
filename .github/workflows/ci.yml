# Every job installs Rust with a bare `rustup toolchain install`, which installs
# the *active* toolchain — and `rust-toolchain.toml` at the repo root overrides
# what that is, along with the components and targets. So the version lives in
# exactly one place, and a local `cargo clippy` uses the same compiler CI does.
#
# dtolnay/rust-toolchain is deliberately not used here: its `toolchain` input is
# required and the action cannot read rust-toolchain.toml, so keeping it would
# mean a second copy of the version, free to drift from the first. Reading
# `@stable` is how main went red on 2026-07-14 with no code change.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # dtolnay/rust-toolchain used to set this for us; stated here so dropping the
  # action doesn't quietly re-enable incremental artifacts in the cache.
  CARGO_INCREMENTAL: 0

jobs:
  build-and-test:
    name: Build + test
    runs-on: ubuntu-latest
    # Skipped on the forge mirror's runner (git.vividn.dev), where
    # .forgejo/workflows/ci.yml runs instead — see that file. Marker verified
    # inside a live forge job 2026-09-16: github.server_url is the instance URL.
    if: ${{ github.server_url == 'https://github.com' }}
    # Measured on the last green main run (2026-09-09): build-and-test took a few minutes.
    # A hung step used to run until GitHub's 6-hour default; now it fails here.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install --no-self-update

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: cargo-nextest

      - name: cargo build --workspace
        run: cargo build --workspace --all-targets

      - name: cargo nextest run --workspace
        run: cargo nextest run --workspace --no-fail-fast

      - name: cargo test --workspace --doc
        run: cargo test --workspace --doc

      # web/scripts/capture-cli-fixtures.mjs imports only node builtins and
      # the suite's own support module, so this needs no `pnpm install`.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      # A committed-and-unwatched artifact. web/tests/fixtures is
      # what the web job compares datum.day against, and it is captured from
      # the real CLI — so when the CLI's stored shape changes and nobody
      # re-captures, the web suite goes on passing against a remembered
      # datum. Re-capture here (`cargo build --workspace` above already
      # produced target/debug/datum) and fail if anything moved. Same shape
      # as `toolchain-pin`.
      - name: Re-capture the CLI-parity fixtures and compare with the committed copy
        run: |
          set -euo pipefail
          git ls-files --error-unmatch web/tests/fixtures/cli-parity.json >/dev/null
          node web/scripts/capture-cli-fixtures.mjs
          if [ -n "$(git status --porcelain -- web/tests/fixtures)" ]; then
            git diff -- web/tests/fixtures
            echo "::error::web/tests/fixtures/cli-parity.json is out of date with the CLI. Fix: pnpm run test:fixtures && git add web/tests/fixtures"
            exit 1
          fi

      # The CLI's build.rs and the web's build-id.mjs spell one version: the two
      # must name this checkout alike (da-cv118).
      - name: The CLI and datum.day give the same version for this checkout
        run: |
          cli=$(target/debug/datum --version); web=$(node web/scripts/build-id.mjs)
          echo "cli: $cli"; echo "web: $web"
          [ "$cli" = "$web" ] || { echo "::error::datum --version and web/scripts/build-id.mjs disagree"; exit 1; }

  e2e-full:
    name: E2E full cohort (da-1wat)
    runs-on: ubuntu-latest
    # Skipped on the forge mirror's runner (git.vividn.dev), where
    # .forgejo/workflows/ci.yml runs instead — see that file. Marker verified
    # inside a live forge job 2026-09-16: github.server_url is the instance URL.
    if: ${{ github.server_url == 'https://github.com' }}
    # Measured on the last green main run (2026-09-09): build-and-test took a few minutes.
    # A hung step used to run until GitHub's 6-hour default; now it fails here.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install --no-self-update

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: cargo-nextest

      # The fast cohort is already covered by `build-and-test`. This job
      # extends coverage to the full E2E matrix which is gated behind
      # `--features e2e-full` on `datum-commands` so polecat / refinery
      # sessions don't pay the cost on every push. Add new full-cohort
      # cases here (via `e2e_case!(full, ...)`), not in the main job.
      - name: cargo nextest run --features e2e-full
        run: cargo nextest run -p datum-commands --test e2e --features e2e-full --no-fail-fast

  lint:
    name: Lint
    runs-on: ubuntu-latest
    # Skipped on the forge mirror's runner (git.vividn.dev), where
    # .forgejo/workflows/ci.yml runs instead — see that file. Marker verified
    # inside a live forge job 2026-09-16: github.server_url is the instance URL.
    if: ${{ github.server_url == 'https://github.com' }}
    # Measured on the last green main run (2026-09-09): lint took a few minutes.
    # A hung step used to run until GitHub's 6-hour default; now it fails here.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install --no-self-update

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: cargo fmt --all -- --check
        run: cargo fmt --all -- --check

      - name: cargo clippy --workspace --all-targets -- -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

  wasm-check:
    name: WASM check
    runs-on: ubuntu-latest
    # Skipped on the forge mirror's runner (git.vividn.dev), where
    # .forgejo/workflows/ci.yml runs instead — see that file. Marker verified
    # inside a live forge job 2026-09-16: github.server_url is the instance URL.
    if: ${{ github.server_url == 'https://github.com' }}
    # The CLI module compiles SQLite's C for wasm32-wasip1 as well as the
    # whole CLI, which is minutes, not seconds. A hung step used to run until
    # GitHub's 6-hour default; now it fails here.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install --no-self-update

      - name: Add the wasm32 targets
        run: rustup target add wasm32-unknown-unknown wasm32-wasip1

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # The real CLI for wasm32-wasip1 — datum.day's only runner (da-g8o8).
      # It needs a C compiler targeting wasm: the script fetches a PINNED
      # wasi-sdk and binaryen into target/toolchains/, sha256-checked, and
      # nothing else in CI or on a contributor's machine ever needs them.
      - name: Cache the pinned wasi-sdk and binaryen
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: target/toolchains
          key: wasi-toolchains-${{ hashFiles('web/scripts/build-cli-wasm.mjs') }}

      # build-cli-wasm.mjs imports only node builtins, so this needs no
      # `pnpm install` — just an interpreter.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      # The module datum.day loads, which is no longer committed (da-0qa4x):
      # built here and handed to the web job as an artifact, with the SOURCE
      # ensure-wasm.mjs writes beside it, so that job needs no Rust toolchain.
      - name: Build the CLI module
        run: node web/scripts/ensure-wasm.mjs

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: datum-cli-wasm
          path: web/src/lib/wasm/
          if-no-files-found: error

  honesty:
    name: Honesty gates (da-8y2q.7)
    runs-on: ubuntu-latest
    # Skipped on the forge mirror's runner (git.vividn.dev), where
    # .forgejo/workflows/ci.yml runs instead — see that file. Marker verified
    # inside a live forge job 2026-09-16: github.server_url is the instance URL.
    if: ${{ github.server_url == 'https://github.com' }}
    # Measured on the last green main run (2026-09-09): honesty took a few minutes.
    # A hung step used to run until GitHub's 6-hour default; now it fails here.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install --no-self-update

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # Runs the repo-hygiene gates — the four pre-v1 honesty gates and
      # no-slug-keyed-writes (da-anmaz):
      #   - no-cfg-any      — no #[cfg(any())] dead-test trees
      #   - no-r2-stubs     — no `bail!("...stub — R2 extracts...")` shims
      #   - no-legacy-verbs — no Verb::{Occur,Start,Stop,Add} outside migrations
      #   - max-file-size   — no .rs file in crates/ above MAX_FILE_LOC
      #   - no-slug-keyed-writes — no UPDATE/DELETE on entries keyed WHERE slug
      #                     outside tests (a keep-both pair shares its slug)
      # and one anti-drift gate:
      #   - toolchain-pin   — every Dockerfile's `FROM rust:<tag>` agrees with
      #                       rust-toolchain.toml (a stale tag still builds,
      #                       so nothing else would catch it)
      # See `xtask/src/main.rs` for the rules each gate enforces and
      # `scripts/check-honesty.sh` for the same battery as a local hook.
      #
      # `check lint`, not `check all`: this job does not install
      # cargo-nextest, so `check all` would fail at its nextest step. And
      # running it here would duplicate the `lint` and `build-and-test`
      # jobs, which already cover the fmt, clippy, build and test steps
      # `all` adds. `all` is the local one-command mirror of CI; this job
      # is its hygiene quarter.
      - name: cargo xtask check lint
        run: cargo run -q -p xtask -- check lint

  web:
    name: Web (datum.day) ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    # Skipped on the forge mirror's runner (git.vividn.dev), where
    # .forgejo/workflows/ci.yml runs instead — see that file. Marker verified
    # inside a live forge job 2026-09-16: github.server_url is the instance URL.
    if: ${{ github.server_url == 'https://github.com' }}
    # A hung step used to run until GitHub's 6-hour default; now it fails here.
    # A quarter of the suite is a few minutes; the 30 is what one whole suite
    # needed, kept as the ceiling a shard must stay far below.
    timeout-minutes: 30
    # The suite outgrew this runner (da-buqa): 60 files, ~26 minutes of the 30
    # the job had, and main red-or-cancelled for a day with every push
    # deploying blind. So the RUN is split, not the files — each file is its
    # own Chromium and its own `before(startApp)`, so splitting files only
    # ever raises the sum. `web/scripts/test.mjs` does the choosing, from the
    # env below, and prints the files it took; this matrix only says how many
    # parts there are, and the per-file budget lives in that script too, one
    # number for every workflow that runs the suite. fail-fast off: a failure
    # in one quarter must not hide what the other three would have said.
    #
    # `.forgejo/workflows/ci.yml` deliberately stays ONE job: its runner has
    # capacity 1, so a matrix there would serialise four setups on one
    # machine. When the forge has dedicated runners it adopts this matrix —
    # a workflow-only change, because the script already shards.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # The CLI module is built there; this job has no Rust toolchain.
    needs: wasm-check
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # With its SOURCE, which is this commit, so `pretest`'s ensure-wasm.mjs
      # keeps it rather than building.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: datum-cli-wasm
          path: web/src/lib/wasm/

      # pnpm before setup-node: setup-node's `cache: pnpm` needs the binary
      # present to resolve the store path. Version comes from package.json's
      # `packageManager` field, so it cannot drift from what runs locally.
      # `package_json_file` is REQUIRED here and repo-root-relative: the job's
      # `defaults.run.working-directory: web` applies to `run:` steps only, never
      # to an action's inputs, so without it the action looks for packageManager
      # in a root package.json that does not exist and fails with
      # "No pnpm version is specified".
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      # The suite drives the built app in a real browser, because the
      # `run(argv)` seam's storage is SQLite-wasm on OPFS inside a dedicated
      # worker and that exists nowhere else. Only the headless shell is
      # installed — no headed Chromium, no other engines.
      - name: Install the headless browser
        run: pnpm exec playwright install --with-deps --only-shell chromium

      # `pretest` builds the app first; the CLI-parity fixtures under
      # web/tests/fixtures are committed and the CLI module comes from
      # `wasm-check`, so this job needs no Rust toolchain. Regenerate them with `pnpm run test:fixtures` against a
      # built `datum` binary when the CLI's stored shape changes — and if
      # you forget, `build-and-test` re-captures them and goes red.
      # A runner is dedicated, and the load average it carries here is the
      # STALE trace of the build and the browser install that just finished,
      # not work competing with the suite — so this job names its number
      # rather than reading a load that has already ended.
      #
      # The number is ONE, and the number it replaces (three) is why main was
      # red. This job asserted «the three files four cores gave it», and the
      # runner is not four cores: every shard of run 35105972379 printed
      # `test: 2 cores, load 2.0 → 3 files at once (override)`. A file under
      # test is about two cores' worth (a Chromium and the node driving it),
      # so three files on two cores is a 50% oversubscription — and that, not
      # the job cap, is what cut ten files at the then 120 s budget in that run:
      # `# fail 0` in all four shards, every red a `test timed out after
      # 120000ms`. Sharding alone could not have fixed it, because each shard
      # still ran three files on the same two cores. One file at a time is
      # what `filesAtOnce` itself gives a 2-core box, said out loud.
      - name: pnpm test
        run: pnpm test
        env:
          DATUM_TEST_CONCURRENCY: 1
          DATUM_TEST_SHARD: ${{ matrix.shard }}/4
