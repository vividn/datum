# Prebuilt `datum` binaries (da-vpbg3): on each push to main, the CLI for
# Linux (static musl, so no glibc version matters) and macOS, x86_64 and
# aarch64, with a SHA256SUMS and its minisign signature, SHA256SUMS.minisig
# (da-0b55k), as the assets of one rolling release tagged `latest` (a tag
# the forge holds, release/publish.sh). https://datum.day/install.sh (web/static/install.sh) installs
# from it. `datum --version` names the commit, so the tag needs no version.
#
# A tag v<major>.<minor>.<height> is a release that STAYS (da-ec8y8): the forge
# tags each commit that raises the sync floor, and the one before it, which is
# also v<major>.<minor>, its minor's last build
# (.forgejo/workflows/kept-releases.yml), and this builds that commit into a
# release of that tag, which `datum upgrade --to <version>` installs from. Run
# by hand with `tag`, it builds that tag's commit with this workflow: a tag of a
# commit from before this file built tags.
name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'A kept release to build, v<major>.<minor>.<height> (empty: the latest)'
        required: false
        default: ''

# A newer push cancels the run in progress. A run cut short leaves the
# previous build installable: release/publish.sh uploads each binary under its
# build's name and moves SHA256SUMS, which names them, last (da-mzhau). A kept
# release has a group of its own, so no push to main cancels it.
concurrency:
  group: release-${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || 'latest' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The kept release this run builds, or empty for the rolling `latest`.
  TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_RELEASE_STRIP: symbols

jobs:
  build:
    name: Build ${{ matrix.asset }}
    # Only the repository on GitHub publishes: not a fork, and not the forge
    # (git.vividn.dev), whose runner executes .github/workflows too and whose
    # github.server_url is its own (deploy.yml).
    if: ${{ github.repository == 'vividn/datum' && github.server_url == 'https://github.com' }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - { asset: datum-x86_64-linux, target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { asset: datum-aarch64-linux, target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { asset: datum-aarch64-macos, target: aarch64-apple-darwin, os: macos-latest }
          - { asset: datum-x86_64-macos, target: x86_64-apple-darwin, os: macos-latest }
    runs-on: ${{ matrix.os }}
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      # Full history: build.rs counts every commit for the version's height,
      # and says `unknown` from a shallow clone.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ env.TAG || github.sha }}

      # The commit built, which build.rs and publish.sh read from GITHUB_SHA:
      # a run by hand has main's there and checked out the tag's. A workflow
      # cannot set a GITHUB_* variable, so each command is handed it.
      - name: Name the commit
        id: sha
        run: |
          sha=$(git rev-parse HEAD)
          echo "BUILD_SHA=$sha" >> "$GITHUB_ENV"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # The arm64 Linux image may come without rustup.
      - name: Install the pinned Rust toolchain
        run: |
          if ! command -v rustup > /dev/null; then
            curl -fsSL https://sh.rustup.rs | sh -s -- -y --no-modify-path --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install --no-self-update
          rustup target add ${{ matrix.target }}

      # ring and rusqlite's bundled SQLite compile C, which a musl target
      # needs a musl C compiler for. Each Linux build runs on its own arch.
      # apt tries each fetch 5 more times, and on x86_64 an install that still
      # fails goes once more to mirrors.edge.kernel.org, the same archive under
      # another host and DNS name: two releases failed resolving
      # security.ubuntu.com (da-6o3dy). kernel.org mirrors no ubuntu-ports, so
      # the aarch64 row has the retries alone.
      - name: Install musl-gcc
        if: ${{ endsWith(matrix.target, '-musl') }}
        run: |
          musl() {
            sudo apt-get -o Acquire::Retries=5 update -q
            sudo apt-get -o Acquire::Retries=5 install -y -q musl-tools
          }
          if musl; then
            echo "musl-tools from the runner's Ubuntu mirrors"
          elif [ "${{ matrix.target }}" = x86_64-unknown-linux-musl ]; then
            echo "::warning::apt failed on the runner's Ubuntu mirrors; trying mirrors.edge.kernel.org"
            sudo sed -i -E 's#https?://([a-z0-9-]+\.)*ubuntu\.com/ubuntu/?([[:space:]]|$)#https://mirrors.edge.kernel.org/ubuntu/\2#' \
              $(ls /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2> /dev/null)
            musl
            echo "musl-tools from mirrors.edge.kernel.org"
          else
            exit 1
          fi
          target=${{ matrix.target }}
          echo "CC_${target//-/_}=musl-gcc" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: GITHUB_SHA=$BUILD_SHA cargo build --release --locked -p datum-cli --target ${{ matrix.target }}

      # Not the x86_64 macOS build, cross-compiled on an arm64 runner.
      - name: Check it runs and names this commit
        if: ${{ matrix.target != 'x86_64-apple-darwin' }}
        run: |
          out=$(target/${{ matrix.target }}/release/datum --version)
          echo "$out"
          case "$out" in *"(${BUILD_SHA:0:7})"*) ;; *) echo "::error::--version does not name ${BUILD_SHA:0:7}"; exit 1 ;; esac
          # A kept release is named for the version its build prints, or for its
          # minor alone, the last build of it (v<major>.<minor>).
          case "$out" in "datum ${TAG#v}-"* | "datum ${TAG#v} "*) ;; "datum ${TAG#v}."*) [ "${TAG//[^.]/}" = . ] || { echo "::error::--version is not $TAG's"; exit 1; } ;; *) [ -z "$TAG" ] || { echo "::error::--version is not $TAG's"; exit 1; } ;; esac

      - name: Name the binary
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/datum dist/${{ matrix.asset }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # MINISIGN_SECRET_KEY lives in this environment, which only main deploys.
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_SHA: ${{ needs.build.outputs.sha }}
    steps:
      # release/: publish.sh, and minisign.pub for the signature's check.
      # Before the download, which a checkout's clean would remove.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: release

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Install minisign
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q minisign

      # release/minisign.pub is the public half, built into every datum. A
      # new key ships in a release the old one still signs (AGENTS.md).
      - name: Write SHA256SUMS, sign it and publish
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: GITHUB_SHA=$BUILD_SHA release/publish.sh dist "$TAG"
