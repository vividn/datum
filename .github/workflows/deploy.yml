# datum.day is a static bundle in a bucket, so a deploy is a file sync and a
# rollback is redeploying an earlier tree (web/DEPLOY.md). There is no schema to
# migrate and no server state a bad deploy could damage — users' entries live in
# their own browsers — which is why main ships unguarded rather than through a
# release gate.
name: Deploy datum.day

# A push to main (da-causk). The module is not committed (da-0qa4x); the
# deploy gets it itself, below — fetched from the `wasm` branch when an
# earlier main commit with these crates already has one, built otherwise —
# rather than waiting for the forge's wasm.yml to commit one to `wasm` and
# deploying on THAT push, which queued every deploy behind a PR-CI lane and
# made GITHUB_SHA, and so the gear menu's hash, the `wasm` commit's.
on:
  push:
    branches: [main]
  # A deploy is sometimes needed with no commit behind it. The bucket's error
  # document and its public-read policy are not in this repo, and the verify
  # step below is how you find out whether a change to either actually landed.
  workflow_dispatch:

# A newer deploy cancels the one in progress. `aws s3 sync` is not atomic, so a
# cancelled upload leaves the bucket holding part of each build — but the run
# that cancelled it then syncs the whole of the newer build over it, which is
# the repair; content-hashed files a half-run left behind are never
# referenced. Queueing never deployed a superseded commit either — GitHub
# keeps one pending run per group and cancels an older pending one — so what
# cancelling changes is only that the deploy already in flight stops instead
# of finishing first.
concurrency:
  group: deploy-datum-day
  cancel-in-progress: true

# Nothing here writes to the repo. The only credentials that matter are the
# bucket's, and they come from the `production` environment below.
permissions:
  contents: read

jobs:
  deploy:
    name: Build, upload, verify
    runs-on: ubuntu-latest
    # The forge (git.vividn.dev) mirrors this repo and its runner executes
    # .github/workflows too. There the AWS secrets do not exist, so this job
    # would build for ~30 min on the shared 3-core runner and then fail. The
    # marker verified inside a live forge job on 2026-09-16: GITHUB_SERVER_URL
    # is the instance URL (https://git.vividn.dev), GITHUB_ACTIONS=true, and no
    # GITEA_/FORGEJO_ variable is set — so the server URL is the discriminator.
    if: ${{ github.server_url == 'https://github.com' }}
    # Environment-scoped rather than repo-scoped secrets: the bucket key is then
    # unreachable from every other workflow in this repo, and the environment is
    # where a required reviewer or a branch restriction goes if this ever wants
    # one.
    environment:
      name: production
      url: https://datum.day
    steps:
      # Full history: ensure-wasm.mjs compares this commit's crates against
      # the SOURCE of each `wasm` commit, and needs origin/main and origin/wasm,
      # which a full-depth checkout fetches along with every other branch.
      # And the gear's `3.0.<height>-beta` counts every commit, which a shallow
      # checkout would cut short (it says `3.0.0-beta` there, da-5172a).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # ubuntu-24.04 ships aws-cli 2.36.35 (checked 2026-09-08 against
      # actions/runner-images), but `ubuntu-latest` is a moving label and the
      # preinstalled set moves with it. Asserted rather than assumed, and first:
      # deploy.sh has this same check, but it fires after the install and the
      # build, minutes in, and says only "not found".
      - name: Assert the aws CLI is on the runner
        run: |
          aws --version || {
            echo "::error::No aws CLI on ubuntu-latest. The runner image dropped it — add an install step (web/DEPLOY.md step 0) or pin runs-on to an image that still has it."
            exit 1
          }

      # pnpm before setup-node, and `package_json_file` repo-root-relative:
      # setup-node's `cache: pnpm` needs the binary present to resolve the store
      # path, and an action's inputs are never reached by a working-directory
      # default. Identical to ci.yml's web job on purpose — if the two drift,
      # the thing CI tested is not the thing this uploads.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # A web-only merge FETCHES: its crates are an earlier main commit's, and
      # that commit's module is on `wasm` already. A merge that changes Rust
      # usually BUILDS, because the deploy starts before the forge's wasm.yml
      # has committed this commit's module — correct, only slower (~73 s of
      # build plus the toolchain), and Rust is installed only then. deploy.sh
      # runs ensure-wasm.mjs again, which keeps what this step put there.
      - name: Fetch the CLI module, or build it
        run: |
          set -euo pipefail
          node web/scripts/ensure-wasm.mjs --fetch-only && exit 0 || [ $? = 2 ]
          rustup toolchain install --no-self-update
          rustup target add wasm32-wasip1
          node web/scripts/ensure-wasm.mjs

      # For `just verify` below. install-action is already how this repo
      # installs cargo-nextest, so it is not a new dependency to trust.
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: just

      # deploy.sh runs its own `pnpm install` and build, so it is called
      # directly rather than through `just deploy` — that recipe's `build`
      # dependency would build a second time, and would do it before any install
      # has happened.
      - name: Build and upload
        env:
          DATUM_DAY_BUCKET: ${{ vars.DATUM_DAY_BUCKET }}
          DATUM_DAY_ENDPOINT: ${{ vars.DATUM_DAY_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: ./web/deploy.sh --yes

      # From outside, over the real CDN, because every failure this can catch
      # lives between the bucket and the browser and none of them are visible to
      # a successful upload — a deploy that reports success serves 403s if the
      # bucket policy is missing. `just verify` rather than a curl copied in
      # here: it already prints what each code means, and one copy cannot drift
      # from the other.
      #
      # This step is RED TODAY, and should be: on 2026-09-08 a deep link came
      # back as a bucket 404 rather than the app, because the bucket's error
      # document is not index.html yet (web/DEPLOY.md step 1), so every deep
      # link into the app is broken. That is a real defect in what users get,
      # so it fails the job rather than being tolerated — the fix is one
      # bucket setting, not a change to this file.
      - name: Verify the live site
        run: |
          just verify || {
            echo "::error::datum.day is not serving 200 on both / and /nowview — the codes are printed above. 404 on /nowview only: the bucket error document is not index.html (web/DEPLOY.md step 1). 403: the objects are not publicly readable. 000: nothing answered at all."
            exit 1
          }
