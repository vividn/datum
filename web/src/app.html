<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<!-- iOS reads neither the manifest's icons nor `rel="icon"` for a home
		     screen tile; this link is the only one it takes. -->
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/apple-touch-icon.png" />
		<!-- `viewport-fit=cover` so the shell reaches under a notch or a home
		     indicator and pads itself with `env(safe-area-inset-*)`;
		     `interactive-widget=resizes-content` so Chromium's on-screen
		     keyboard shrinks the viewport the shell is fixed to, rather than
		     covering the prompt (da-31ts). -->
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
		/>
		<title>datum</title>
		<!-- What an agent fetching this page reads before any script runs: the
		     page itself is drawn by JavaScript, so without these an agent sees
		     the one word above. agents.md is the guide for AI agents, llms.txt
		     the convention that points to it. -->
		<meta
			name="description"
			content="datum records a life as small timestamped entries and shows them back. AI agents: read https://datum.day/agents.md to help your person set up their tracking."
		/>
		<link rel="alternate" type="text/markdown" href="/agents.md" title="datum.day for AI agents" />
		<!-- The browser's own chrome around the page. A literal because a
		     meta tag is read before any stylesheet, so no token can reach it. -->
		<meta name="theme-color" content="#1a1a2e" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.json" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<!-- Shown only without scripts, which is how most agents fetch a page. -->
		<noscript>
			<p>
				datum records a life as small timestamped entries. AI agents: the guide to helping your
				person set up their tracking is at <a href="/agents.md">datum.day/agents.md</a>.
			</p>
		</noscript>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
