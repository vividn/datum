version: '3'

services:
  couchdb:
    image: 'couchdb:2.3.1'
    logging:
      options:
        max-size: '100m'
    restart: 'always'
    ports:
      - '5984:5984'
      - '5986:5986'
      - '4369:4369'
      - '9100-9200:9100-9200'
    volumes:
      - '${HOME}/.couchdb:/opt/couchdb/data'
    environment:
      - COUCHDB_USER: 'admin'
      - COUCHDB_PASSWORD: '***REMOVED***'
      - COUCHDB_SECRET: 'secret secret secret'
      - NODENAME




