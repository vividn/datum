<rect x="214" y="3" width="9" height="9" fill="#7bd389"/><text x="227" y="12">deepwork</text>
<line x1="0" y1="30" x2="480" y2="30" stroke="#808080" stroke-opacity="0.6"/>
<rect x="0" y="22" width="72" height="16" fill="#4f8fe8"/><rect x="72" y="22" width="88" height="16" fill="#d48788"/><rect x="160" y="22" width="32" height="16" fill="#4f8fe8"/><rect x="232" y="22" width="96" height="16" fill="#d48788"/><rect x="328" y="22" width="56" height="16" fill="#4f8fe8"/><rect x="384" y="22" width="16" height="16" fill="#7bd389"/><rect x="400" y="22" width="80" height="16" fill="#d48788"/>
</svg>
