<svg xmlns="http://www.w3.org/2000/svg" width="480" height="40" viewBox="0 0 480 40" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#808080">
<!-- The same working day as kind-moment.svg: all email and meetings, with a sliver of deep work. -->
<title>activity, a change: blocks of email, meeting and deepwork, changing color as the state changes</title>
