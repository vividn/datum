[package]
name = "datum-core"
version.workspace = true
edition.workspace = true

[features]
default = []
# Enables shared test fixtures (entry/spec/alias builders, fresh_db(),
# assertion macros) for use by integration tests in sibling crates.
test-util = []

[dev-dependencies]
tempfile = "3"
# Self-dependency so this crate's own integration tests get the
# test-util fixtures (same pattern as datum-cli).
datum-core = { path = ".", features = ["test-util"] }

[dependencies]
datum-parse = { path = "../datum-parse" }
serde = { workspace = true }
serde_json = { workspace = true }
rusqlite = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
md-5 = { workspace = true }
rand = { workspace = true }
toml = { workspace = true }
