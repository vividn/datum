[package]
name = "datum-cli"
version.workspace = true
edition.workspace = true
# One test binary, not one per file: see tests/main.rs (da-ztzfi).
autotests = false

[lib]
name = "datum_cli"
path = "src/lib.rs"

[features]
default = ["png", "native"]
# Everything that cannot exist under WASI, forwarded to `datum-commands/native`
# plus the CLI's own: the REPL's line editor (rustyline -> home, which has no
# wasi arm). `--no-default-features` is the wasm32-wasip1 build the browser
# runs (da-1vat).
native = ["datum-commands/native", "dep:rustyline"]
# Shared test fixtures (TestPrompter, etc.) for use by integration tests.
test-util = []
# Forwards to `datum-commands/png`. Default-on so distributed `datum`
# binaries keep `dayview --output foo.png` and `nowview --output foo.png`
# working out of the box. Drop with `--no-default-features` for size-
# constrained builds (the dayview/nowview commands then reject `*.png` with
# a friendly error and continue to support svg/html/json output).
png = ["datum-commands/png"]

[[bin]]
name = "datum"
path = "src/main.rs"

[[test]]
name = "main"
path = "tests/main.rs"

# A file that writes the process env keeps a binary of its own: in `main` its
# writes would reach the in-process tests that never take `env_lock`.
[[test]]
name = "config_layers"
path = "tests/config_layers.rs"

[[test]]
name = "db_resolution"
path = "tests/db_resolution.rs"

[[test]]
name = "e2e_bin_smoke"
path = "tests/e2e_bin_smoke.rs"

[[test]]
name = "stats_cmd"
path = "tests/stats_cmd.rs"

[dependencies]
datum-core = { path = "../datum-core" }
datum-commands = { path = "../datum-commands", default-features = false }
datum-parse = { path = "../datum-parse" }
anyhow = { workspace = true }
rustyline = { version = "18", optional = true }

[dev-dependencies]
datum-core = { path = "../datum-core", features = ["test-util"] }
datum-cli = { path = ".", features = ["test-util"] }
datum-commands = { path = "../datum-commands", features = ["test-util"] }
datum-test-util = { path = "../datum-test-util" }
# The README anti-drift test calls the generator itself, never a copy of it.
xtask = { path = "../../xtask" }
rusqlite = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = "3"
md-5 = { workspace = true }
# A software passkey for the sync chain tests (da-odwc7).
p256 = { workspace = true }
sha2 = { workspace = true }
data-encoding = { workspace = true }
