[package]
name = "datum-cli"
version.workspace = true
edition.workspace = true

[lib]
name = "datum_cli"
path = "src/lib.rs"

[[bin]]
name = "datum"
path = "src/main.rs"

[dependencies]
datum-core = { path = "../datum-core" }
datum-layout = { path = "../datum-layout" }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
dirs-next = "2"
ulid = { workspace = true }
sha2 = { workspace = true }
regex = { workspace = true }
tempfile = "3"
flate2 = { workspace = true }
tar = { workspace = true }
toml = { workspace = true }
serde_yaml = { workspace = true }

[dev-dependencies]
datum-core = { path = "../datum-core", features = ["test-util"] }
