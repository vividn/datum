[package]
name = "datum-cli"
version.workspace = true
edition.workspace = true

[lib]
name = "datum_cli"
path = "src/lib.rs"

[features]
default = []
# Shared test fixtures (TestPrompter, etc.) for use by integration tests.
test-util = []

[[bin]]
name = "datum"
path = "src/main.rs"

[dependencies]
datum-core = { path = "../datum-core" }
datum-commands = { path = "../datum-commands" }
datum-parse = { path = "../datum-parse" }
anyhow = { workspace = true }
rustyline = "18"

[dev-dependencies]
datum-core = { path = "../datum-core", features = ["test-util"] }
datum-cli = { path = ".", features = ["test-util"] }
datum-commands = { path = "../datum-commands", features = ["test-util"] }
datum-sync-client = { path = "../datum-sync-client" }
datum-sync-server = { path = "../datum-sync-server" }
url = "2"
uuid = { version = "1", features = ["v4"] }
rusqlite = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = "3"
md-5 = { workspace = true }
