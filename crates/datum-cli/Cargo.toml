[package]
name = "datum-cli"
version.workspace = true
edition.workspace = true

[lib]
name = "datum_cli"
path = "src/lib.rs"

[features]
default = ["png", "native"]
# Everything that cannot exist under WASI, forwarded to `datum-commands/native`
# plus the CLI's own two: the REPL's line editor (rustyline -> home, which
# has no wasi arm) and the in-process sync daemon (tokio, notify, reqwest).
# `--no-default-features` is the wasm32-wasip1 build the browser runs (da-1vat).
native = ["datum-commands/native", "dep:rustyline", "dep:datum-sync-agent"]
# Shared test fixtures (TestPrompter, etc.) for use by integration tests.
test-util = []
# Forwards to `datum-commands/png`. Default-on so distributed `datum`
# binaries keep `dayview --output foo.png` and `nowview --output foo.png`
# working out of the box. Drop with `--no-default-features` for size-
# constrained builds (the dayview/nowview commands then reject `*.png` with
# a friendly error and continue to support svg/html/json output).
png = ["datum-commands/png"]

[[bin]]
name = "datum"
path = "src/main.rs"

[dependencies]
datum-core = { path = "../datum-core" }
datum-commands = { path = "../datum-commands", default-features = false, features = ["db", "clock"] }
datum-parse = { path = "../datum-parse" }
# `datum sync agent` hosts the sync daemon inside the `datum` binary, so the
# installed service unit execs a binary the upgrade path already keeps current.
datum-sync-agent = { path = "../datum-sync-agent", optional = true }
anyhow = { workspace = true }
rustyline = { version = "18", optional = true }

[dev-dependencies]
datum-core = { path = "../datum-core", features = ["test-util"] }
datum-cli = { path = ".", features = ["test-util"] }
datum-commands = { path = "../datum-commands", features = ["test-util"] }
datum-sync-client = { path = "../datum-sync-client" }
datum-sync-protocol = { path = "../datum-sync-protocol" }
datum-sync-server = { path = "../datum-sync-server" }
datum-test-util = { path = "../datum-test-util" }
url = "2"
uuid = { version = "1", features = ["v4"] }
rusqlite = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = "3"
md-5 = { workspace = true }
