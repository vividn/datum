# Where daydumb's output differs from v2's committed snapshot (da-ma5pr).
#
# `daydumb_matches_v2_snapshots` (tests/text_goldens.rs) runs every fixture
# through daydumb and compares what it DRAWS with `expected/<name>.txt`:
# text as characters and styles, SVG as shapes at their absolute position,
# give or take a pixel. A fixture listed here passes only while its
# difference is exactly `divergences/<name>.diff` (`-` v2, `+` daydumb).
# Any other difference fails, and so does a listed one that went away.
#
# This list is for vividn's walk: each rule ends as a daydumb fix (its entries
# and diffs deleted) or as a difference he accepts. `status` is `open` until
# he says otherwise; `accepted` is his word, never a can's. A rule's `why`
# says what the history records, and says so when it records nothing.
#
# Never edit a snapshot to match daydumb. They are v2's raw output, and
# only `PARITY_REGEN=1` under `--features parity-runtime` writes them.

# ─── text: get and tail ─────────────────────────────────────────────────────

[[rule]]
id = "grey-date"
status = "open"
what = "daydumb greys the date half of a timestamp (`2024-01-15` in fg 90); v2 prints it plain"
why = "No recorded reason found."

[[rule]]
id = "get-field-gap"
status = "open"
what = "`get` puts two spaces between the timestamp and the field; v2 puts one"
why = "No recorded reason found."

[[rule]]
id = "null-before-point"
status = "open"
what = "a point entry with no earlier state: v2 draws its `●` on the grey (#888888) no-state box; daydumb draws a grey `∅` and then the `●`, with no box"
why = "No recorded reason found. (A point that follows another point of its field matches v2: no box, no `∅`.)"

[[rule]]
id = "null-lead-glyph"
status = "open"
what = "a state change with no earlier state: v2's leading edge is the grey box holding a dark-grey `∅`; daydumb's is the grey box, empty"
why = "daydumb draws a change's two edges as coloured cells, colour and no text (da-fknn8, #74; two each since da-pc7x7). No record found of a decision to drop v2's `∅` from the box."

[[rule]]
id = "tail-n-column"
status = "open"
what = "`tail` leads every row with its `_n` shorthand (grey `_3`, `_2`, `_1`) under a `_n` header"
why = "Deliberate: da-8sx8 shows the `_N` shorthand beside every row; da-431c (#44) made it the first column."

[[rule]]
id = "tail-offset-in-header"
status = "open"
what = "`tail` writes the UTC offset once, in the header (`time (+1)`), and not on the rows; v2 writes `+1` after every timestamp"
why = "Deliberate: da-lkji (bfbd030e) moved the offset to the header; a row prints its own only when it differs."

[[rule]]
id = "tail-column-padding"
status = "open"
what = "`tail` pads the `hid` column differently: v2 leaves more blanks before it"
why = "No recorded reason found; it follows from each runtime's column widths."

[[rule]]
id = "tail-trailing-blank-line"
status = "open"
what = "v2's `tail` ends with an empty line; daydumb's ends at the last row"
why = "No recorded reason found."

[[rule]]
id = "get-data-commas"
status = "open"
what = "`get` ends each data line but the last with a comma (`lang: \"de\",`); daydumb puts none"
why = "No recorded reason found."

[[rule]]
id = "object-value-one-line"
status = "open"
what = "`get` prints an object data value as one line of JSON (`{\"o\":1,\"tz\":…,\"utc\":…}`, keys sorted); v2 pretty-prints it over several lines, keys as stored (`utc`, `o`, `tz`)"
why = "No recorded reason found."

[[rule]]
id = "on-off-states"
status = "open"
what = "a boolean state reads `on` / `off`; v2 says `start` / `end`"
why = "vividn, 2026-10-19 (da-66c3l): «I'm leaning towards on/off for these binary fields», «yes go ahead»: start/end name what you do, on/off what the field is. The verbs stay start/end."

[[rule]]
id = "two-column-slots"
status = "open"
what = "a state change's leading and trailing edges are two columns each, a point's mark stands in the leading edge's second column (its field's symbol where it has one), and a multi-state edge is two cells split diagonally; v2's are one column, a `●` and a `▞`"
why = "vividn, 2026-10-28 (da-pc7x7): «let's have the the previous and following/continuing state blocks be two characters instead of one … it actually looks nicer and suggests more about the change», «It is intentional drift away from v2.»"

# ─── SVG: dayview ───────────────────────────────────────────────────────────

[[rule]]
id = "dayview-axis"
status = "open"
what = "the hour labels: v2 draws them at 9px and centres the closing `00` on its tick, half off the picture; daydumb sizes them to fill the strip below the ticks (11.1px in its 15px) and insets the closing `00` to end where the axis does"
why = "The size is da-l3tzj: vividn asked for hour numbers that fill the strip, and v2's 9px is one line in `axis_label_size` if he prefers it. The inset is da-i37p2: vividn allowed v2's crop or an inset, and a `00` cut at 11.1px reads as `0`. The ticks (25, 6px) and the hooked axis path match v2."

[[rule]]
id = "dayview-day-label-x"
status = "open"
what = "the day labels (`Mon`, `Jan 15`, the year) end at x=78 in daydumb and at x=72 in v2 (v2's `-0.5em` left of the data area)"
why = "No recorded reason found."

[[rule]]
id = "dayview-dot-size"
status = "open"
what = "an occur dot: v2's is as tall as its lane (r=6 in the default lane at this height); daydumb's is two thirds of the default lane, 0.08 of the day, whatever its lane, times `--symbol-scale`"
why = "da-ijjjn, vividn, 2026-10-26: «maybe just a default size * symbol-scale is the way to go, so not even taking into consideration the lane size?» and «yes let's go for it», after «the default occur dot size is still too big»; vividn, 2026-10-27: «occur dots are a little too small by default, increase their default size from 6 -> 9» (da-sjhuj); vividn, 2026-10-28: «occur dots are now a little bit too big by default … maybe 0.08 is correct?» (da-a87dh)."

[[rule]]
id = "snapshot-year-masked"
status = "open"
what = "v2's year label reads `<HID>`, daydumb's `2024`"
why = "A defect of the snapshot, not of either runtime: the live test's `normalize` took the year (alone on its pretty-printed line) for a tail hid and masked it at capture. Fixing it means regenerating the six dayview snapshots, which is vividn's to approve."

