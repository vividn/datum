# Text-output goldens for original-datum.
#
# Each `[[fixture]]` describes:
#   * `name`        — stable id, used as `expected/<name>.txt` filename.
#                     `[a-z0-9_]+`, unique within the bundle.
#   * `description` — human-readable purpose, surfaced on test failure.
#   * `surface`     — `get` | `tail` | `dayview` | `nowview` (the CLI
#                     surface this fixture exercises).
#   * `setup`       — array of arg vectors run before `query` to seed
#                     state. Use `-d YYYY-MM-DD -t HHMM` flags for
#                     deterministic time pinning.
#   * `query`       — single arg vector whose stdout we pin.
#
# The committed `expected/<name>.txt` file is the captured stdout from
# running this fixture under `parity-runtime`. To regenerate after
# pinning a new datum SHA, run:
#
#   cargo test --features parity-runtime -p datum-parity \
#     -- text_goldens_match_live_datum --nocapture
#
# with `PARITY_REGEN=1` set.
#
# Adding a fixture: pick a new `name`, write its setup + query, run with
# PARITY_REGEN=1 to capture, audit the diff in `expected/<name>.txt`,
# commit both files together.
#
# The normal suite runs every fixture through daydumb and compares it to
# that snapshot (`daydumb_matches_v2_snapshots`). Where daydumb differs,
# record the difference in `divergences.toml` for vividn's walk; never edit
# a snapshot to match daydumb.

# ─── get: single-record reads ────────────────────────────────────────────────

