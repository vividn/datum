# da-zwct: the fixture the dayview set was missing. Every other dayview
# fixture builds its blocks from `start`/`end` PAIRS, whose two instants
# say where the block is outright — so none of them could tell a reader
# that runs a duration forward from a reader that runs it back. This one
# gives the block as a duration and nothing else: datum's own
# `durationBlocks` view emits `blockBegin = occurTime - dur`, so the
# golden draws 12:00–12:30, and daydumb has to land the block there too.
[[fixture]]
name = "dayview_duration_block_svg"
description = "`dayview` SVG for a block given as a duration — occur_time is its END and the 30m precede it (da-zwct)"
surface = "dayview"
setup = [
  ["start", "work", "30", "-d", "2024-01-15", "-t", "1230"],
]
query = ["dayview", "-d", "2024-01-15"]

# da-6gvw: the set had no `false` block. `end work 5` stores a duration
# block whose state is `false` — the field was OFF for those five minutes
# — and daydumb painted it in the field's colour on top of the running
# `work` block instead of cutting a hole in it. Datum's own renderer
# drops a `simplifyState` → false block and lets the gap show; this
# fixture is that reading, held against the reference.
[[fixture]]
name = "dayview_false_block_is_a_hole_svg"
description = "`dayview` SVG where a `false` duration block cuts a hole in the enclosing block (da-6gvw)"
surface = "dayview"
setup = [
  ["start", "work", "-d", "2024-01-15", "-t", "0900"],
  ["end", "work", "5", "-d", "2024-01-15", "-t", "1000"],
  ["end", "work", "-d", "2024-01-15", "-t", "1200"],
]
query = ["dayview", "-d", "2024-01-15"]
