# ─── nowview: current-state SVG visualization ────────────────────────────────
#
# nowview/dayview render an SVG file rather than text on stdout. The
# harness writes to a temp `<name>.svg`, reads the bytes back, and pins
# the SVG XML as the golden. SVG is text and chalks correctly into a
# byte-equality comparison once chalk's truecolor output is stable
# (FORCE_COLOR=3 / COLORTERM=truecolor in the runtime env).

[[fixture]]
name = "nowview_default_svg"
description = "`nowview` — default SVG snapshot of all tracked fields' current state"
surface = "nowview"
setup = [
  ["switch", "mood", "happy", "-d", "2024-01-15", "-t", "1000"],
]
query = ["nowview"]
uncapturable = "nowview renders relative to wall-clock now: the SVG carries the current instant in data-time/data-end-time and derives block geometry from it, so two runs a second apart differ"

[[fixture]]
name = "nowview_after_state_chain_svg"
description = "`nowview` SVG after multiple switches — final state is the visible one"
surface = "nowview"
setup = [
  ["switch", "mood", "happy", "-d", "2024-01-15", "-t", "0900"],
  ["switch", "mood", "sad",   "-d", "2024-01-15", "-t", "1200"],
  ["switch", "mood", "tired", "-d", "2024-01-15", "-t", "1800"],
]
query = ["nowview"]
uncapturable = "same as nowview_default_svg — output is a function of now, not of the fixture"

