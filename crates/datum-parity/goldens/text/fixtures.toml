# Text-output goldens for original-datum.
#
# Each `[[fixture]]` describes:
#   * `name`        — stable id, used as `expected/<name>.txt` filename.
#                     `[a-z0-9_]+`, unique within the bundle.
#   * `description` — human-readable purpose, surfaced on test failure.
#   * `surface`     — `get` | `tail` | `dayview` | `nowview` (the CLI
#                     surface this fixture exercises).
#   * `setup`       — array of arg vectors run before `query` to seed
#                     state. Use `-d YYYY-MM-DD -t HHMM` flags for
#                     deterministic time pinning.
#   * `query`       — single arg vector whose stdout we pin.
#
# The committed `expected/<name>.txt` file is the captured stdout from
# running this fixture under `parity-runtime`. To regenerate after
# pinning a new datum SHA, run:
#
#   cargo test --features parity-runtime -p datum-parity \
#     -- text_goldens_match_live_datum --nocapture
#
# with `PARITY_REGEN=1` set.
#
# Adding a fixture: pick a new `name`, write its setup + query, run with
# PARITY_REGEN=1 to capture, audit the diff in `expected/<name>.txt`,
# commit both files together.

# ─── get: single-record reads ────────────────────────────────────────────────

[[fixture]]
name = "get_occur_default"
description = "default `get` on a point-time occur entry"
surface = "get"
setup = [
  ["occur", "coffee", "-d", "2024-01-15", "-t", "0900"],
]
query = ["get", "coffee:2024-01-15T08:00:00.000Z"]

[[fixture]]
name = "get_switch_state"
description = "default `get` on a switch entry with a state value"
surface = "get"
setup = [
  ["switch", "mood", "happy", "-d", "2024-01-15", "-t", "1000"],
]
query = ["get", "mood:2024-01-15T09:00:00.000Z"]

[[fixture]]
name = "get_start_block"
description = "`get` on a start (block) entry — captures `start` shape"
surface = "get"
setup = [
  ["start", "work", "-d", "2024-01-15", "-t", "0930"],
]
query = ["get", "work:2024-01-15T08:30:00.000Z"]

[[fixture]]
name = "get_with_extra_data"
description = "`get` on an occur entry with key=value extra data"
surface = "get"
setup = [
  ["occur", "weight", "value=75.2", "-d", "2024-01-15", "-t", "0700"],
]
query = ["get", "weight:2024-01-15T06:00:00.000Z"]

[[fixture]]
name = "get_with_unit"
description = "`get` with a unit annotation (TS-side parses `=NUM<unit>`)"
surface = "get"
setup = [
  ["occur", "caffeine", "-d", "2024-01-15", "-t", "1000", "amount=200mg"],
]
query = ["get", "caffeine:2024-01-15T09:00:00.000Z"]

[[fixture]]
name = "get_show_all"
description = "`get -A` shows full document (data + meta) for one entry"
surface = "get"
setup = [
  ["occur", "coffee", "-d", "2024-01-15", "-t", "0900"],
]
query = ["get", "coffee:2024-01-15T08:00:00.000Z", "-A"]

