# Byte-level `content_hash` fixtures (da-yira).
#
# The merge order `(modify_time, content_hash, device_id, hid)` is only
# deterministic across implementations if every implementation derives the
# same `content_hash` bytes. `docs/sync-protocol.md` § "Canonical
# serialization" specifies the preimage; these fixtures pin it so a second
# implementation can check itself instead of reverse-engineering the
# convention from observed behaviour.
#
# Each fixture carries:
#   * the entry's hashed columns, `state` / `data` / `following_state` given
#     as they might arrive (keys deliberately NOT in sorted order);
#   * `parts` — the seven canonical preimage segments, in order;
#   * `preimage_hex` — lowercase hex of `parts` joined by a single 0x00 byte;
#   * `content_hash` — lowercase hex `SHA-256` of those bytes.
#
# `tests/hash_goldens.rs` checks the three against each other AND against
# `datum_core::entry::Entry::expected_content_hash`, so a drift in either the
# fixture or the implementation fails.

[[fixture]]
name = "flat-point"
description = "Minimal occur entry: no state, no data, `MOMENT` dur."
field = "coffee"
occur = "2026-03-16T09:15:00Z"
dur = "MOMENT"
parts = ["coffee", "2026-03-16T09:15:00+00:00", "MOMENT", "", "", "", ""]
preimage_hex = "636f6666656500323032362d30332d31365430393a31353a30302b30303a3030004d4f4d454e5400000000"
content_hash = "ecc13ff36e656560fcc6d460d110cdadb304e02ff317f3c6c588050b02f2fc34"

