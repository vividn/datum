[package]
name = "datum-parity"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Cross-runtime parity tests: daydumb vs. original datum (vividn/datum)."

[features]
default = []
# Enables tests that spawn the original datum (TS) binary. Requires node + a
# clone of vividn/datum at `target/parity-cache/datum` (managed by
# `scripts/setup_datum.sh`). Off by default so plain `cargo test` doesn't
# pull a node toolchain into a Rust-only build.
parity-runtime = []

[dependencies]
# For `src/bin/daydumb.rs`, the binary the text goldens run (da-ma5pr).
datum-cli = { path = "../datum-cli" }
md-5 = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
proptest = "1"
tempfile = "3"
chrono = { workspace = true }
regex-lite = { workspace = true }
# Reads both runtimes' dayview SVG as a drawing, not as bytes (da-ma5pr).
roxmltree = "0.21"
# `tests/hash_goldens.rs` checks the pinned content_hash preimages against
# what datum-core actually computes — the goldens are only worth anything
# if they're bound to the implementation.
datum-core = { path = "../datum-core" }
serde_json = { workspace = true }
sha2 = { workspace = true }
