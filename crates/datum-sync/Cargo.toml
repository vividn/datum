[package]
name = "datum-sync"
version.workspace = true
edition.workspace = true

# Easy Sync's transport (da-rugg8): the iroh endpoint and the sync session.
# Native only — datum-commands pulls it in behind its `net` feature, which the
# wasm32-wasip1 build (no sockets) leaves off.
[dependencies]
datum-core = { path = "../datum-core" }
iroh = "1.3"
tokio = { version = "1", features = ["rt", "macros", "time", "signal"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
data-encoding = "2"
qrcode = { version = "0.14", default-features = false }
anyhow = { workspace = true }
chrono = { workspace = true }
libc = { workspace = true }
rand = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
