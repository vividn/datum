[package]
name = "datum-sync-server"
version.workspace = true
edition.workspace = true

[lib]
name = "datum_sync_server"
path = "src/lib.rs"

[[bin]]
name = "datum-sync-server"
path = "src/main.rs"

[dependencies]
# Shared wire types — single source of truth between client and server.
datum-sync-protocol = { path = "../datum-sync-protocol" }

# Workspace
tokio = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rusqlite = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }

# HTTP middleware
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Auth
webauthn-rs = "0.5"
jsonwebtoken = "9"

# URL parsing (for WebAuthn origin)
url = "2"

# Utils
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
rand = { workspace = true }
sha2 = { workspace = true }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
