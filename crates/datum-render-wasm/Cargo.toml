[package]
name = "datum-render-wasm"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["native"]
# `native` is default-on so a host build keeps the crates' host-only code;
# the browser build turns it off, which is what makes them compile for wasm.
native = ["datum-commands/native", "datum-parse/native", "datum-core/native"]

[dependencies]
datum-commands = { path = "../datum-commands", default-features = false }
datum-core = { path = "../datum-core", default-features = false }
datum-parse = { path = "../datum-parse", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
# The tests feed this crate exactly what the browser feeds it: the entry
# `datum-parse-wasm` built from an argv. Parse and render meet in one test.
datum-parse-wasm = { path = "../datum-parse-wasm", default-features = false }
