[package]
name = "datum-sync-wire"
version.workspace = true
edition.workspace = true

# Easy Sync's session protocol (da-6kpj5), apart from any storage: the frames,
# the handshake, the exchange and the iroh endpoint, over a `Store` the caller
# supplies. Natively `datum-sync` supplies one over `Db`; in the browser
# (wasm32-unknown-unknown, relay-only) datum.day's sync worker supplies one
# that runs the CLI, and `web` is its wasm-bindgen face.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
iroh = { version = "1.3", default-features = false, features = ["tls-ring"] }
n0-future = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
data-encoding = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
getrandom = { version = "0.3", features = ["wasm_js"] }

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
