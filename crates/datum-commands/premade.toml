# The premade examples: fields ready to set up, by theme (da-rky8h). datum
# compiles this file in; `datum setup --premade` lists it and `--json` prints
# it whole, which is how datum.day reads it. Add an `[[example]]` and it is
# in the catalog.
#
# An example says:
#   field, theme, kind   its name, its theme (one of `themes`) and its kind:
#                        occur (a moment), start (on/off), switch (a change),
#                        add (a record) or allday
#   symbol, color, shows its icon, its color and what it shows, in a line
#   keys                 its data keys as `setup -k` declares them: `name`
#                        required, `name=` optional, `name=x` a default
#   choices              ways to log it that each give their own `keys`
#                        (weight's lbs or kg), the first the default
#   states               a change's states and their colors, in order
#   never_false, aliases, symbol_by
#                        as the spec stores them; an alias is
#                        { name, expands_to, kind }
#   place                where its lane is, as the spec's presentation reads
#                        it: `y` the top edge with a `height`, a dot's centre
#                        without; `symbol_scale` a dot's size
#   labels               what each mark prints and where: `{ show, at }`, a
#                        data key (or field, at, state) and a position
#   day                  its example day, local clocks: a moment's
#                        `{ at = "HH:MM", <key> = value }`, an on/off's
#                        `{ from, to }` (`to` before `from` runs past
#                        midnight), a change's `{ at, state }` (`false` is
#                        off), an all day's one value
#   label, [[example.as]]
#                        another kind for the same field, with its own
#                        label, shows and day, offered beside the example's
#                        own label; only where people really split
# Any other key is the spec's own, given to `setup --from-json` as it is
# (`id_keys`, `remainder`, `state_lookup_field`).
#
# The places are one map, so the fields set up together sit in rows of
# their own: sleep along the top, food and the body's moments under it, work
# across the middle, screens and mind below, chores and habits low, where you
# are along the bottom.

themes = ["body", "food, drink & drugs", "mind", "work", "home & chores", "screens & media", "habits", "records"]

# ── body ──

[[example]]
field = "sleep"
theme = "body"
kind = "start"
symbol = "🌙"
color = "#7b68ee"
shows = "on at night, off in the morning"
place = { y = 0.02, height = 0.16 }
day = [{ from = "23:35", to = "07:05" }]

[[example]]
field = "weight"
theme = "body"
kind = "occur"
symbol = "⚖"
color = "#8fbc8f"
shows = "each weighing, in lbs or kg"
choices = { lbs = { keys = ["lbs="], labels = [{ show = "lbs", at = "over" }] }, kg = { keys = ["kg="], labels = [{ show = "kg", at = "over" }] } }
place = { y = 0.3, symbol_scale = 1.2 }
day = [{ at = "07:12", kg = 72.4, lbs = 159.6 }]

[[example]]
field = "headache"
theme = "body"
kind = "start"
symbol = "⚡"
color = "#d46a6a"
shows = "on while it lasts, off when it ends"
place = { y = 0.2, height = 0.06 }
day = [{ from = "14:20", to = "16:50" }]

[[example]]
field = "shower"
theme = "body"
kind = "start"
symbol = "🚿"
color = "#5ac8d4"
