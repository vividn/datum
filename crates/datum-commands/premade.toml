day = [
  { from = "07:50", to = "08:20" },
  { from = "08:32", to = "08:54" },
  { from = "09:05", to = "10:40" },
  { from = "10:55", to = "12:30" },
  { from = "13:15", to = "15:00" },
  { from = "15:20", to = "17:45" },
  { from = "17:52", to = "18:14" },
  { from = "19:15", to = "19:55" },
  { from = "20:30", to = "22:40" },
]

[[example]]
field = "run"
theme = "body"
kind = "start"
symbol = "🏃"
color = "#e8734a"
shows = "on as you set off, off with how far, in km"
