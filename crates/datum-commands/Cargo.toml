[package]
name = "datum-commands"
version.workspace = true
edition.workspace = true

[lib]
name = "datum_commands"
path = "src/lib.rs"

[features]
default = ["native"]
# Surfaces that cannot exist in a browser, gathered behind one flag so a wasm
# build is `--no-default-features` rather than a list of exclusions:
#   crossterm — terminal control, used only by the `tail --watch` TUI
#   tempfile  — on-disk scratch files: the atomic config write, and the
#               buffer `datum edit` hands to $EDITOR
# Native builds are unchanged; this feature is on by default. The
# wasm32-wasip1 CLI (da-1vat) turns it off: it has a clock (WASI's
# `clock_time_get`, and `TZ` from its caller) but no terminal.
native = ["dep:crossterm", "dep:tempfile", "net"]
# Easy Sync over iroh (da-rugg8): `sync`, `sync chain invite / join`, `sync run`.
# WASI has no sockets, so the wasm build leaves it off and
# those subcommands say so.
net = ["dep:datum-sync"]
# Shared test fixtures (TestPrompter, etc.) — also consumed by datum-cli tests.
test-util = []
# Marker for the full E2E case cohort (da-1wat). Cases tagged
# `e2e_case!(full, ...)` are `#[ignore]` by default and only run when
# this feature is enabled. Polecat pre-submit / refinery skip the full
# cohort; CI runs it in a dedicated job.
e2e-full = []

[dependencies]
datum-core = { path = "../datum-core" }
datum-layout = { path = "../datum-layout" }
datum-parse = { path = "../datum-parse" }
datum-sync = { path = "../datum-sync", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
# `datum upgrade` checks the release's signature over SHA256SUMS (da-0b55k):
# small, and no dependencies of its own.
minisign-verify = "0.3.0"
anyhow = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
regex-lite = { workspace = true }
unicode-width = { workspace = true }
# Vets a field's custom SVG icon (da-45wgz) before it is stored.
roxmltree = "0.21"
# `sync qr`: the invite ticket datum.day shows as a QR (da-bjxts).
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
tempfile = { version = "3", optional = true }
flate2 = { workspace = true }
tar = { workspace = true }
toml = { workspace = true }
libc = { workspace = true }
# Alt-screen TUI for `datum tail -w` (da-3l6m): key/mouse events + raw mode.
crossterm = { workspace = true, optional = true }

[dev-dependencies]
# Tests reach for tempfile directly (isolated XDG homes, kit round-trips), and
# they run on every feature set — so it is listed here as well as optionally
# above, or `--no-default-features --all-targets` loses it with `native`.
tempfile = "3"
datum-core = { path = "../datum-core", features = ["test-util"] }
datum-test-util = { path = "../datum-test-util" }
rusqlite = { workspace = true }
# Re-exported via `datum_parse::alias::shell_split` for the e2e harness;
# datum-parse is already a runtime dep, so no extra crate needed.
