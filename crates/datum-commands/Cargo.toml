[package]
name = "datum-commands"
version.workspace = true
edition.workspace = true

[lib]
name = "datum_commands"
path = "src/lib.rs"

[features]
default = []
# Shared test fixtures (TestPrompter, etc.) — also consumed by datum-cli tests.
test-util = []
# Marker for the full E2E case cohort (da-1wat). Cases tagged
# `e2e_case!(full, ...)` are `#[ignore]` by default and only run when
# this feature is enabled. Polecat pre-submit / refinery skip the full
# cohort; CI runs it in a dedicated job.
e2e-full = []
# Pulls in resvg + tiny-skia for SVG → PNG rasterization. The dayview/nowview
# `--output *.png` paths require this; SVG/HTML/JSON output stays available
# without it. ~50 transitive crates and ~1.5 MiB of `.text` come with this
# feature, so size-conscious downstream builds (WASM, embedded CI) drop it
# via `--no-default-features`.
png = ["dep:resvg"]

[dependencies]
datum-core = { path = "../datum-core" }
datum-layout = { path = "../datum-layout" }
datum-parse = { path = "../datum-parse" }
datum-sync-client = { path = "../datum-sync-client" }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
ulid = { workspace = true }
md-5 = { workspace = true }
regex-lite = { workspace = true }
tempfile = "3"
flate2 = { workspace = true }
tar = { workspace = true }
toml = { workspace = true }
reqwest = { workspace = true }
rpassword = { workspace = true }
url = { workspace = true }
rand = { workspace = true }
libc = { workspace = true }
# Pure-Rust SVG → PNG rasterization for `datum {dayview,nowview} --output
# foo.png`. Optional via the `png` feature: ~50 transitive crates + ~1.5 MiB
# of `.text` drop out under `--no-default-features`. Pulled at the CLI
# boundary so `datum-layout` stays WASM-clean (browsers render SVG natively;
# PNG is only a CLI-side convenience).
resvg = { version = "0.47", default-features = false, features = ["text", "system-fonts", "memmap-fonts"], optional = true }

[dev-dependencies]
datum-core = { path = "../datum-core", features = ["test-util"] }
rusqlite = { workspace = true }
# Re-exported via `datum_parse::alias::shell_split` for the e2e harness;
# datum-parse is already a runtime dep, so no extra crate needed.
