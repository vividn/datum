[package]
name = "datum-commands"
version.workspace = true
edition.workspace = true

[lib]
name = "datum_commands"
path = "src/lib.rs"

[features]
default = []
# Shared test fixtures (TestPrompter, etc.) — also consumed by datum-cli tests.
test-util = []

[dependencies]
datum-core = { path = "../datum-core" }
datum-layout = { path = "../datum-layout" }
datum-sync-client = { path = "../datum-sync-client" }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
ulid = { workspace = true }
sha2 = { workspace = true }
regex = { workspace = true }
tempfile = "3"
flate2 = { workspace = true }
tar = { workspace = true }
toml = { workspace = true }
serde_yaml = { workspace = true }
reqwest = { workspace = true }
rpassword = { workspace = true }
base64 = { workspace = true }
url = { workspace = true }
rand = { workspace = true }
dirs-next = "2"

[dev-dependencies]
datum-core = { path = "../datum-core", features = ["test-util"] }
rusqlite = { workspace = true }
