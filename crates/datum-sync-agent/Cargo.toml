[package]
name = "datum-sync-agent"
version.workspace = true
edition.workspace = true

# Background daemon that wraps `datum-sync-client` to push-on-write and
# pull on a periodic interval without requiring the CLI to be open. The
# library target exposes pure scheduling / debounce / backoff logic for
# unit tests; the binary target wires them to real tokio tasks, a
# filesystem watcher, and a pid-file.

[lib]
name = "datum_sync_agent"
path = "src/lib.rs"

[[bin]]
name = "datum-sync-agent"
path = "src/main.rs"

[dependencies]
datum-sync-client = { path = "../datum-sync-client" }
datum-commands = { path = "../datum-commands" }
datum-core = { path = "../datum-core" }
anyhow = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
notify = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
libc = { workspace = true }

[dev-dependencies]
datum-core = { path = "../datum-core", features = ["test-util"] }
tokio = { workspace = true }
tempfile = "3"
