# The one place the Rust version is decided — CI reads this file, not `stable`.
#
# Why pin at all: on 2026-07-14 stable moved 1.95.0 -> 1.97.1, clippy 1.97 added
# the `question_mark` lint, and CI's blanket `-D warnings` turned it into a hard
# error. `main` and five open PRs went red without a line of code changing.
#
# To bump: change `channel` here, run the gates locally
# (`cargo fmt --all -- --check`, `cargo clippy --workspace --all-targets -- -D warnings`,
# `cargo nextest run --workspace`), fix whatever the new release flags, and merge
# that as its own PR. Upgrading is a deliberate act, not something that happens
# to us on a Tuesday.
[toolchain]
channel = "1.97.1"
# `profile` is explicit because rustup's own default is machine-configurable;
# `default` is what supplies rustdoc for `cargo test --doc`.
profile = "default"
# `rust-src` is here for REPRODUCIBILITY, not for tooling, though rust-analyzer
# also requires it. With rust-src installed rustc reports standard-library
# locations from the local sysroot; without it, as `/rustc/<commit>/...` -- and
# the two do not merely spell paths differently, they emit DIFFERENT AMOUNTS of
# location info (measured 2026-09-08: 12 std references vs 1 in datum-parse.wasm).
# So `wasm-check`, which rebuilds the committed wasm and compares bytes, can only
# pass if CI and developers agree on this component. Every developer with a
# working IDE has it; CI did not, and the committed artifact matched only CI.
components = ["rustfmt", "clippy", "rust-src"]
# `wasm-check` builds datum-sync-client for the browser.
targets = ["wasm32-unknown-unknown"]
