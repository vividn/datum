[package]
name = "xtask"
version.workspace = true
edition.workspace = true
publish = false

[lib]
name = "xtask"
path = "src/lib.rs"

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
datum-parse = { path = "../crates/datum-parse" }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# `cargo xtask health` parses the source; all three are already in Cargo.lock
# through other crates. `span-locations` gives a parsed span its line.
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
