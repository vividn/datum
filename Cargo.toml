[workspace]
members = [
    "crates/datum-core",
    "crates/datum-cli",
    "crates/datum-commands",
    "crates/datum-layout",
    "crates/datum-parity",
    "crates/datum-parse",
    "crates/datum-sync-agent",
    "crates/datum-sync-client",
    "crates/datum-sync-protocol",
    "crates/datum-sync-server",
    "crates/datum-test-util",
    "xtask",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["vividn"]
license = "MIT"

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
# "hooks" is dependency-free; it exposes progress_handler, which
# execute_view uses to interrupt runaway kit views (da-sky7).
rusqlite = { version = "0.32", features = ["bundled", "hooks"] }

# Time
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = { version = "0.10", features = ["serde"] }

# IDs
ulid = { version = "1", features = ["serde"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Async (for sync server)
tokio = { version = "1", features = ["full"] }
axum = "0.7"

# Crypto
aes-gcm = "0.10"
sha2 = "0.10"
md-5 = "0.10"
rand = "0.8"
argon2 = "0.5"
rpassword = "7"
zeroize = "1"

# HTTP client (blocking — CLI is synchronous)
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

# Base64 encoding (url-safe no-pad per sync-protocol.md)
base64 = "0.22"

# Text
regex-lite = "0.1"
unicode-width = "0.2"

# Archive formats (used by backup/restore)
flate2 = "1"
tar = "0.4"

# Config format (dbs.toml registry + datumrc.toml user config)
toml = "0.8"

# URL parsing
url = "2"

# Filesystem watching (used by datum-sync-agent)
notify = "6"

# Low-level syscalls (used by datum-sync-agent for pid-alive checks)
libc = "0.2"

# Terminal UI — alt-screen + key/mouse events for `datum tail -w` (da-3l6m).
# `event-stream` is intentionally omitted: the watch loop is synchronous and
# polls `event::poll`, so no async runtime is pulled in.
crossterm = "0.28"

# Structured logging (journalctl-friendly output for the daemon)
tracing = "0.1"
tracing-subscriber = { version = "0.3" }
