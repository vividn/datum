[workspace]
members = [
    "crates/datum-core",
    "crates/datum-cli",
    "crates/datum-layout",
    "crates/datum-sync",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["vividn"]
license = "MIT"

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# Time
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = { version = "0.10", features = ["serde"] }

# IDs
ulid = { version = "1", features = ["serde"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Async (for sync server)
tokio = { version = "1", features = ["full"] }
axum = "0.7"

# Crypto
aes-gcm = "0.10"
sha2 = "0.10"
rand = "0.8"
argon2 = "0.5"
rpassword = "7"

# HTTP client (blocking — CLI is synchronous)
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

# Base64 encoding (url-safe no-pad per sync-protocol.md)
base64 = "0.22"

# Text
regex = "1"

# Archive formats (used by backup/restore)
flate2 = "1"
tar = "0.4"

# Config format (registry in dbs.toml)
toml = "0.8"

# User config (datumrc.yml)
serde_yaml = "0.9"

# URL parsing
url = "2"
