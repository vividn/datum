[workspace]
members = [
    "crates/datum-core",
    "crates/datum-cli",
    "crates/datum-commands",
    "crates/datum-layout",
    "crates/datum-parity",
    "crates/datum-parse",
    "crates/datum-sync",
    "crates/datum-test-util",
    "xtask",
]
resolver = "2"

[workspace.package]
version = "3.0.0-beta"
edition = "2021"
authors = ["vividn"]
license = "MIT"

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
# "float_roundtrip" makes serde_json's PARSER exact: without it the default
# fast path is off by up to one ULP on long mantissas, so a logged
# `0.23633156966490299` came back as `0.236331569664903` — a different
# double (da-uru7). The writer (ryu) was always shortest-round-trip; this
# makes the reader match it, so a number survives argv -> store -> JSON.
serde_json = { version = "1", features = ["float_roundtrip"] }

# Database
# "hooks" is dependency-free; it exposes progress_handler, which
# execute_view uses to interrupt runaway kit views (da-sky7).
rusqlite = { version = "0.32", features = ["bundled", "functions", "hooks"] }

# Time
# `default-features = false` drops chrono's `wasmbind`, which on
# `wasm32-unknown-unknown` pulls wasm-bindgen in to read the browser's
# clock. `clock` + `std` are what the default set otherwise gave us on
# native; `oldtime` is a deprecated no-op.
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
chrono-tz = { version = "0.10", features = ["serde"] }

# IDs
ulid = { version = "1", features = ["serde"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Crypto
sha2 = "0.10"
md-5 = "0.10"
rand = "0.8"
# Easy Sync: each database copy signs its ops with an Ed25519 endpoint key —
# the curve iroh uses, so the same key becomes the iroh endpoint (da-k329q).
ed25519-dalek = { version = "2", default-features = false, features = ["std", "fast", "rand_core", "zeroize"] }
# The sync chain's admin keys are passkeys: a WebAuthn assertion is ES256
# (P-256 ECDSA), verified by every peer offline (da-odwc7).
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
data-encoding = "2"

# Text
regex-lite = "0.1"
unicode-width = "0.2"

# Archive formats (used by backup/restore)
flate2 = "1"
tar = "0.4"

# Config format (dbs.toml registry + datumrc.toml user config)
toml = "0.8"

# The keys a kit TOML holds that no struct reads, to refuse by name
serde_ignored = "0.1"

# A kit's states in the order the kit wrote them (da-dtmlv)
indexmap = { version = "2", features = ["serde"] }

# Low-level syscalls (terminal size for `tail` and the renderers)
libc = "0.2"

# Terminal UI — alt-screen + key/mouse events for `datum tail -w` (da-3l6m).
# `event-stream` is intentionally omitted: the watch loop is synchronous and
# polls `event::poll`, so no async runtime is pulled in.
crossterm = "0.28"

# ── Build-artifact size, added 2026-09-02 ───────────────────────────────
# Full debug info was costing ~200 MB PER TEST BINARY and 23 GB across the
# workspace's ~90 of them. That is what filled the CI runner's disk
# ("rustc-LLVM ERROR: IO failure on output stream: No space left on device"
# on every PR today), and it is most of the 36 GB a local `target/` reaches.
#
# `line-tables-only` keeps what a backtrace actually needs -- file and line
# for every frame -- and drops the variable/type debug info that a debugger
# would want and that nothing in CI reads. Linking gets correspondingly
# faster, which is the other half of the complaint: a can waiting 25 minutes
# for a workspace test run is mostly waiting on the linker.
[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

# Size-first profile for the browser's `datum-cli.wasm` (da-6h6p, da-g8o8;
# `web/scripts/build-cli-wasm.mjs`). Separate from `release` so the native
# CLI keeps its speed-first build: this one trades a little throughput for
# an artifact small enough to ship in the app shell.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
