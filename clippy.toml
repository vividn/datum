# Local wall-clock → UTC conversion has exactly one sanctioned implementation:
# `datum_parse::time::resolve` (da-ztae). Documentation does not keep that true
# — this codebase has proof. `stats` grew its own 14-line `parse_since` while
# three careful parsers sat one crate away (da-rye2), and `coerce.rs` ignored a
# field the parser had already filled in (da-svvy). Both authors could have
# known and did not.
#
# So the guarantee is a lint, not a note: reinventing the conversion fails CI.
# `resolve.rs` itself carries a scoped `#[allow]` — it is the wrapper.
disallowed-methods = [
    { path = "chrono::TimeZone::from_local_datetime", reason = "use datum_parse::time::Zone::resolve, then Resolved::for_boundary() (da-ztae) — .single() silently drops the two DST cases" },
    { path = "chrono::NaiveDateTime::and_local_timezone", reason = "use datum_parse::time::Zone::resolve, then Resolved::for_boundary() (da-ztae) — .single() silently drops the two DST cases" },

    # A transaction opens in `db::write` alone (da-8i7f0): what a write reads
    # and computes happens on a View before the lock, and the lock is held
    # for the writes. `db/write.rs` carries the one scoped `#[allow]`.
    { path = "rusqlite::Connection::transaction", reason = "open a write only through Db::write / compute_then_write (da-8i7f0)" },
    { path = "rusqlite::Connection::transaction_with_behavior", reason = "open a write only through Db::write / compute_then_write (da-8i7f0)" },
    { path = "rusqlite::Connection::unchecked_transaction", reason = "open a write only through Db::write / compute_then_write (da-8i7f0)" },
    { path = "rusqlite::Connection::savepoint", reason = "open a write only through Db::write / compute_then_write (da-8i7f0)" },
    { path = "rusqlite::Connection::savepoint_with_name", reason = "open a write only through Db::write / compute_then_write (da-8i7f0)" },
    { path = "rusqlite::Transaction::new", reason = "open a write only through Db::write / compute_then_write (da-8i7f0)" },
    { path = "rusqlite::Transaction::new_unchecked", reason = "open a write only through Db::write / compute_then_write (da-8i7f0)" },
    { path = "rusqlite::Transaction::savepoint", reason = "open a write only through Db::write / compute_then_write (da-8i7f0)" },
    { path = "rusqlite::Transaction::savepoint_with_name", reason = "open a write only through Db::write / compute_then_write (da-8i7f0)" },
    { path = "rusqlite::Savepoint::new", reason = "open a write only through Db::write / compute_then_write (da-8i7f0)" },
]

# The reader's zone likewise has one source: `Zone::host()` / `DatumTime::now()`,
# which honour `TZ`. `chrono::Local` knows no zone under wasm32-wasip1, so in the
# browser it is UTC — the nowview's clock and the dayview's today read UTC there
# while every entry was stamped in the page's zone (da-y6qj). `host_offset` in
# `clock.rs` carries a scoped `#[allow]` — it is the fallback for a nameless host.
disallowed-types = [
    { path = "chrono::Local", reason = "use datum_parse::time::Zone::host() or DatumTime::now() (da-y6qj) — chrono::Local is UTC under wasm32-wasip1" },
]
