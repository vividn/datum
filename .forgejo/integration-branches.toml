# The integration permit (da-44xpb). An integration branch carries one epic's
# work under a lighter review and CI until the epic lands on staging whole
# (AGENTS.md, «Integration branches»). Each [[branch]] below is one, and
# adding an entry IS the permit: a change to .forgejo/ is vividn's to
# approve, so no integration branch exists without his yes (vividn,
# 2026-10-22: «it requires approval from me to establish a new integration
# section»).
#
# ci.yml reads this file. A PR into a listed branch, a push to one, and a sync
# of one before it lands run its `integration` job, the light one, and not the
# full `ci` job. The full
# job runs each night at every listed branch's tip (integration-nightly.yml
# reads this file too), and on the epic's PR into staging. A name is under
# `integration/`, since that is the push trigger ci.yml listens on.
#
#   name       the branch
#   epic       the epic bead its work belongs to
#   review     the default review level for its beads
#   web_tests  the web test files the light job runs, `tests/<file>` each
#   web_tests_glob  optional, `tests/<pattern>`: a file it matches that
#              web_tests does not name turns the light job red (da-s8x24)
#
# None is listed now: the first, integration/tutorial (epic da-uzyih), was
# retired on 2026-11-06, its work on staging.
