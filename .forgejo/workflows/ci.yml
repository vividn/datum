# The forge's CI (da-uskg): what git.vividn.dev runs at every head, so its
# merge gate can read a commit status that covers ALL the code — cargo and
# web/ both. GitHub keeps .github/workflows/ci.yml until the cutover; that
# file's jobs skip themselves on the forge (job-level `if` on
# github.server_url), so the two never run side by side on one runner.
#
# The runner this is written for, measured 2026-09-16 (task 184, the Web job
# of the GitHub workflow, which the forge ran from the mirror at 14:58):
#   · forgejo-runner on the forge box itself: 3 cores, 3.9 GB, no swap,
#     capacity 1, per-job cap 3 h, default job image node:20-bookworm
#     (root, gcc 12, make, pkg-config, libssl-dev, python 3.11, curl; no
#     /usr/bin/time, no rustup).
#   · Actions resolve from https://data.forgejo.org — but only the ones it
#     carries: actions/checkout, actions/setup-node and pnpm/action-setup
#     did; Swatinem/rust-cache and taiki-e/install-action do not exist there
#     and killed every Rust job of the GitHub workflow in 3 s. So: full URLs
#     pinned by SHA for the three actions we keep, and no cache or installer
#     actions at all — rustup and nextest are installed in-job.
#   · The web suite ran to its end in 21m43s at concurrency 3: 481 pass,
#     0 fail, 12 files cut at the 120 s budget — the same twelve GitHub's
#     4-core runner cuts (da-buqa). Memory never below ~2 GB available.
#
# One job, sequential steps, on purpose: capacity 1 and 3 cores mean parallel
# jobs would only queue, and one job keeps the two memory peaks (linking the
# workspace's test binaries; the browser suite) from ever overlapping. Heavy
# steps run under /usr/bin/time -v so max RSS and wall time land in the log —
# those numbers are what decides whether this box carries datum's CI.
name: CI

on:
  pull_request:
  push:
    # `ci/**` is for bisecting a red main (da-2f1vp): push the midpoint commit
    # as `ci/<sha8>`, read its verdict, delete the branch. Such a run is never
    # dropped as superseded — that step is main's and staging's alone. A red
    # main whose tree a green staging run passed is a FLAKE, not a bisect
    # trigger: the train already tested that exact tree (da-kc0k7).
    # `staging` is the merge train's (ct-yesk): approved PRs land there, and
    # each reaches main (the same PR merge as before) only once a staging
    # commit holding it runs green, main's tree then checked equal to that
    # commit's. So a push to staging runs exactly as a push to main does.
    branches: [main, staging, 'ci/**']
    # `hero/**` used to be here so a hero's branch reached the runner through
    # the mirror before the cutover, when the forge had no PRs. Since
    # 2026-09-16 17:0x branches are pushed to the forge itself and their PRs
    # trigger the run — with both triggers every PR head ran TWICE, two
    # ~40-minute runs on a capacity-1 runner (mayor, 17:03, reading PR 2).
  # `ct run dispatch` runs staging's tip again with no push, to answer a flaky
  # red (ct-bzat). Such a run is a push run in everything below: the staging
  # runner, the whole web suite, and evidence main inherits. It takes NO
  # inputs, and must not gain one: a green dispatched run promotes main
  # because nothing could have told it to skip a step.
  workflow_dispatch:

# One run per ref at a time. On a PR ref a newer push cancels the run of the
# head it replaced instead of queueing behind it: four runs sat «waiting» at
# 17:09 behind one another, each for a head that no longer mattered. NOT on
# main or staging (da-rwbq9): a run already RUNNING there is never cancelled —
# a merge does not supersede an answer being worked out — so their runs queue.
# Staging is main's twin because the train promotes only a green staging
# commit (ct-yesk): its verdict is the one main waits on.
#
# But main and staging verify their NEWEST commit only (vividn, 2026-09-24,
# da-2f1vp). At 40–60 min a run, a day of merges queued eleven runs behind
# one that had waited three hours to start, and a verdict that late tells
# nobody anything. So a queued run that starts for a commit its branch has
# moved past cancels itself (the first step below) and ends CANCELLED, never
# green; only the tip is verified. An older commit is verified on demand,
# when main goes red, by bisecting through `ci/**` branches (see `on.push`) —
# unless staging passed its tree, which makes the red a flake (da-kc0k7).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/staging' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  # 3 cores, 3.9 GB, no swap. Run 235 (2026-09-16, CARGO_BUILD_JOBS=2) peaked
  # at 728 MB across the whole Rust battery — build 658 MB, clippy 590 MB —
  # with the box never under ~2 GB available, so all three cores may build.
  CARGO_BUILD_JOBS: 3

jobs:
  ci:
    name: CI (cargo + web)
    # A staging run, pushed or dispatched, runs on its own runner, labelled ONLY
    # `staging` so it never takes a PR job (da-laema). On the shared one it
    # queued behind every PR run and, started after the tip had moved,
    # cancelled itself at the step below (run 2169: ~27 min waiting, then
    # that). Now it starts on the tip and finishes, and the runs queued behind
    # it cancel in seconds. With no runner carrying that label, a staging run
    # waits forever.
    runs-on: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/staging' && 'staging' || 'ubuntu-latest' }}
    # GitHub's six jobs sum to ~27 min on separate 4-core runners; serialised
    # on 3 cores the bead expects 45–75 min. The runner's own cap is 3 h.
    timeout-minutes: 150
    steps:
      # A push to main whose COMMIT a green ci.yml run already tested ends GREEN
      # here (da-7wmzo). Under the integration branch (ct-0eyz) cantown-bot
      # fast-forwards main to a staging commit only once staging's run on
      # it is green, so main's sha IS the tested sha and testing it again is
      # an hour of runner for nothing. The evidence is a RUN, which only the
      # forge creates — never a commit status, which anyone with write can
      # post: a completed `success` run of this workflow, triggered by a push
      # or a dispatch (a pull_request run may have skipped the web suite, see
      # WEB below), on exactly this sha. The trigger is read from
      # `trigger_event`: the API answers `event: ""` for a dispatched run
      # (run 1719, parity.yml's, on Forgejo 16.0.5). Found, it sets the same
      # TRAIN=1 as the next step.
      # None — a direct push, a red or unfinished staging run — and the run goes
      # on in full; so does an unreadable API, with a warning saying so.
      - name: Inherit a green run of this commit
        if: github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
        run: |
          set -uo pipefail
          url="${SERVER%/}/api/v1/repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}"
          runs=$(printf 'header = "Authorization: token %s"\n' "$TOKEN" | curl -sSf -K - "$url" 2>&1) ||
            { echo "::warning::could not read $url ($runs); verifying ${{ github.sha }} in full"; exit 0; }
          found=$(node -e 'const r = JSON.parse(require("fs").readFileSync(0)).workflow_runs.find(r => r.workflow_id === "ci.yml" && ["push", "workflow_dispatch"].includes(r.trigger_event) && r.status === "success" && r.commit_sha === process.argv[1]); if (r) console.log(`run ${r.id} (${r.prettyref})`, r.html_url)' "${{ github.sha }}" <<<"$runs" 2>/dev/null) ||
            { echo "::warning::$url did not answer a run list; verifying ${{ github.sha }} in full"; exit 0; }
          if [ -n "$found" ]; then
            echo "TRAIN=1" >> "$GITHUB_ENV"
            echo "inherited, every later step skipped: $found"
          else
            echo "no green ci.yml push or dispatched run on ${{ github.sha }}"
          fi

      # The merge train's bridge, kept until the cutover to the integration
      # branch (ct-0eyz) removes it: the train squashes, so main's sha is not
      # the staging sha it tested and the step above finds nothing.
      # A push to main whose tree a green staging run already tested ends GREEN
      # here, without testing it again (da-kc0k7): 10 of 10 main runs on 10-01
      # were such re-tests, 5h14m of runner. The alchemiter, once it has
      # checked main's tree equal to the green staging commit's, posts a
      # `ci/train` success on main's commit (cantown ct-gvou) — AFTER the merge
      # push, so this polls for ~30 s. Only cantown-bot's counts: anyone with
      # write can post a status. Found, TRAIN=1 skips every later step (each
      # tests `env.TRAIN != '1'`, which an unset TRAIN passes; the web chain
      # needs WEB, set only by a gated step), so the job ends green — never a
      # cancel, which the forge maps to failure. Absent or unreadable — a
      # direct merge carries none — the run goes on in full.
      - name: Inherit the merge train's verdict for this tree
        if: github.ref == 'refs/heads/main' && env.TRAIN != '1'
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
        run: |
          set -uo pipefail
          url="${SERVER%/}/api/v1/repos/${{ github.repository }}/statuses/${{ github.sha }}?limit=50"
          for i in 1 2 3 4 5 6 7; do
            found=$(printf 'header = "Authorization: token %s"\n' "$TOKEN" | curl -sSf -K - "$url" 2>/dev/null |
              node -e 'const s = JSON.parse(require("fs").readFileSync(0)).find(s => s.context === "ci/train" && s.status === "success" && s.creator?.login === "cantown-bot"); if (s) console.log(s.description, s.target_url)' 2>/dev/null)
            if [ -n "$found" ]; then
              echo "TRAIN=1" >> "$GITHUB_ENV"
              echo "inherited, every later step skipped: $found"
              exit 0
            fi
            [ "$i" = 7 ] || sleep 5
          done
          echo "no ci/train success from cantown-bot on ${{ github.sha }}; verifying it in full"

      # A main or staging run for a commit its branch has moved past cancels
      # its own run with the job's token (write on its own repo: Forgejo
      # 16.0.5's routers/api/v1/permissions/repo_access.go) and then waits for
      # the runner to kill it, so no step after this one runs. The forge maps a
      # cancelled job to a `failure` commit status — never `success`. If the
      # tip cannot be read or the cancel is refused, the run goes on in full:
      # a real verdict, as before this step existed.
      - name: Cancel this run if its branch has moved past its commit
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging') && env.TRAIN != '1'
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
        run: |
          set -uo pipefail
          api="${SERVER%/}/api/v1/repos/${{ github.repository }}"
          call() { printf 'header = "Authorization: token %s"\n' "$TOKEN" | curl -sSf -K - "$@"; }
          tip=$(call "$api/branches/${{ github.ref_name }}" | node -p 'JSON.parse(require("fs").readFileSync(0)).commit.id' 2>/dev/null) || tip=
          if [ -z "$tip" ]; then echo "::warning::could not read ${{ github.ref_name }}'s tip; verifying ${{ github.sha }} in full"; exit 0; fi
          if [ "$tip" = "${{ github.sha }}" ]; then echo "${{ github.sha }} is ${{ github.ref_name }}'s tip"; exit 0; fi
          echo "superseded by $tip"
          call -X POST "$api/actions/runs/${{ github.run_id }}/cancel" || { echo "::warning::cancel refused; verifying ${{ github.sha }} in full"; exit 0; }
          sleep 600
          echo "::error::the run was cancelled but the runner did not stop this job"
          exit 1

      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: env.TRAIN != '1'

      # A PR whose every changed file is Rust test SOURCE (crates/*/tests/*.rs),
      # docs, markdown or scripts/mq-check.sh cannot change what the web runs,
      # so it skips the wasm build and the ~40-minute web suite (da-waghz).
      # Anything else runs everything: crates/*/src (the wasm is built from
      # it), web/, Cargo.*, .forgejo/, and the rest of crates/*/tests/ —
      # web/tests/dbio.test.mjs reads crates/datum-cli/tests/fixtures/. Markdown
      # under web/ or crates/*/src/ runs too (web/static/ is served), and so
      # does an empty diff. Every push runs everything — to main, and to
      # staging, whose green commit is what main is promoted to (ct-yesk). WEB
      # is always set and the web steps test `== '1'`: an expression compares
      # loosely, so an UNSET env.WEB equals '0' and `!= '0'` would skip them on
      # a push.
      - name: Can this change reach the web?
        if: env.TRAIN != '1'
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != pull_request ]; then echo "WEB=1" >> "$GITHUB_ENV"; exit 0; fi
          git fetch -q --no-tags --unshallow origin "+refs/heads/$BASE:refs/remotes/origin/$BASE"
          files=$(git diff --name-only "origin/$BASE...HEAD")
          if [ -n "$files" ] && ! grep -qvE '^crates/[^/]+/tests/.*\.rs$|^docs/|\.md$|^scripts/mq-check\.sh$' <<<"$files" \
            && ! grep -qE '^(web|crates/[^/]+/src)/' <<<"$files"; then
            echo "WEB=0" >> "$GITHUB_ENV"
            echo "web suite skipped: $(wc -l <<<"$files") changed files, none can reach the web"
          else
            echo "WEB=1" >> "$GITHUB_ENV"
            echo "web suite runs: a changed file can reach the web"
          fi
          echo "$files"

      # A PR run tests the PR as it would LAND (da-kz73u): its head merged with
      # its base's tip as fetched just above, not on the old base it was cut
      # from. Two PRs each green on their own base and textually clean together
      # still broke staging twice on 10-07 (#495 x #497, #508 x #515). After
      # the step above, so the web decision stays the PR's own diff. A verdict
      # is (head, base@sha): this logs the sha and the last step posts it as a
      # `ci/base` status on the head. A conflict is the one case for a rebase
      # (ct-tahc). It narrows the window, it does not close it: something can
      # still land on the base after this run and before the merge.
      - name: Merge the PR with its base's tip
        if: env.TRAIN != '1' && github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse "origin/$BASE")
          echo "BASE_SHA=$sha" >> "$GITHUB_ENV"
          echo "testing ${{ github.event.pull_request.head.sha }} merged with $BASE at $sha"
          git -c user.name=ci -c user.email=ci@localhost merge -q --no-edit "origin/$BASE" ||
            { git diff --name-only --diff-filter=U; echo "::error::conflicts with $BASE at $sha: rebase"; exit 1; }

      - name: System tools the image lacks (time, for max RSS per step)
        if: env.TRAIN != '1'
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends time >/dev/null && /usr/bin/time --version 2>&1 | head -1

      # rust-toolchain.toml is the ONE place the version lives (channel,
      # profile, components, wasm32-unknown-unknown). rustup with no default
      # toolchain, then the bare install that reads the file — exactly the
      # GitHub workflow's step, minus the runner's preinstalled rustup.
      #
      # The runner shares /root/.cargo between concurrent jobs (da-nmf83), so
      # an install here rewrites binaries another job may be running: job 1100
      # (09-25) died on `cargo-nextest … Text file busy`, job 1470 (09-26) on
      # `/root/.cargo/bin/rustup: Text file busy`. So every install takes
      # .ci-install.lock (wasm.yml's too), and runs only when missing: the
      # installer only when rustup does not run, and `toolchain install` is a
      # no-op once rust-toolchain.toml's toolchain is there.
      - name: Install rustup and the pinned toolchain
        if: env.TRAIN != '1'
        run: |
          set -euo pipefail
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          mkdir -p "$HOME/.cargo" && exec 9>"$HOME/.cargo/.ci-install.lock" && flock 9
          RUSTUP_AUTO_INSTALL=0 rustup --version >/dev/null 2>&1 ||
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none --profile minimal --no-modify-path
          rustup toolchain install --no-self-update
          rustup target add wasm32-wasip1
          rustc --version && cargo --version

      # The prebuilt binary taiki-e/install-action would have fetched, fetched
      # directly: no action, no compile. Pinned, so a run that finds it already
      # there downloads nothing; and replaced by RENAME, never untarred over
      # the binary in place: a job already running the old file keeps its
      # inode, so none sees `Text file busy` (job 1100). The temp dir is under
      # ~/.cargo so the `mv` is a rename on one filesystem.
      - name: Install cargo-nextest (prebuilt)
        if: env.TRAIN != '1'
        run: |
          set -euo pipefail
          v=0.9.146
          exec 9>"$HOME/.cargo/.ci-install.lock" && flock 9
          if ! cargo nextest --version 2>/dev/null | grep -x "release: $v" >/dev/null; then
            tmp=$(mktemp -d "$HOME/.cargo/.nextest.XXXXXX")
            curl -LsSf "https://get.nexte.st/$v/linux" | tar zxf - -C "$tmp"
            mv "$tmp/cargo-nextest" "$HOME/.cargo/bin/cargo-nextest" && rmdir "$tmp"
          fi
          cargo nextest --version

      # A PR runs only the Rust tests its change can reach (da-fnt3v): those
      # whose coverage, in the `testmap` branch's map of a staging commit
      # (testmap.yml), holds a function around a changed line, every test it
      # adds or edits by name, and the tests that read the tree. The whole
      # suite instead, each reason printed, for a manifest, a build script,
      # CI, a non-Rust file under crates/, a migration, test support, a map
      # missing or over ten commits behind, or a selection that fails. A
      # push runs everything: staging's full run is what main is promoted
      # on. The doc tests and the lint gates always run in full.
      - name: Which Rust tests can this change reach?
        if: env.TRAIN != '1' && github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: |
          set -uo pipefail
          sel="$RUNNER_TEMP/tests" map="$RUNNER_TEMP/testmap.json"
          git fetch -q origin +refs/heads/testmap:refs/remotes/origin/testmap &&
            git show origin/testmap:testmap.json > "$map" || echo "no testmap branch"
          cargo run -q -p xtask -- testmap select "$map" "origin/$BASE" "$sel" ||
            { mkdir -p "$sel"; echo "the selection failed" > "$sel/FULL"; echo "::warning::the selection failed: every test runs"; }
          echo "TESTS=$sel" >> "$GITHUB_ENV"

      # ── the Rust battery, in scripts/check.sh's order ─────────────────────
      - name: cargo fmt --all -- --check
        if: env.TRAIN != '1'
        run: cargo fmt --all -- --check

      - name: cargo clippy --workspace --all-targets -- -D warnings
        if: env.TRAIN != '1'
        run: /usr/bin/time -v cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo build --workspace --all-targets
        if: env.TRAIN != '1'
        run: /usr/bin/time -v cargo build --workspace --all-targets

      - name: cargo nextest run --workspace
        if: env.TRAIN != '1'
        env:
          # Known flaky Rust tests get ONE retry, nextest's own, logged as
          # `RETRIED <test> (<bead>): …`; no other test is ever retried
          # (da-4q1wa, scripts/nextest-retry.sh). The rule is the web list's
          # (DATUM_TEST_RETRY, da-8bmqe): an entry needs evidence that the TEST
          # is at fault, not the diff, names its bead, and comes off when that
          # bead's fix lands. One `<test> (<bead>)` line each, the test named
          # as nextest names it, module path and all.
          DATUM_CARGO_RETRY: |
        run: |
          set -euo pipefail
          run=(scripts/nextest-retry.sh /usr/bin/time -v cargo nextest run --workspace --no-fail-fast --test-threads 3 --no-tests=pass)
          if [ -z "${TESTS:-}" ] || [ -e "$TESTS/FULL" ]; then "${run[@]}"
          elif [ -s "$TESTS/workspace.tests" ] || [ -s "$TESTS/new.tests" ]; then
            mapfile -t names < "$TESTS/workspace.tests"; mapfile -t new < "$TESTS/new.tests"
            "${run[@]}" "${new[@]}" -- --exact "${names[@]}"
          else echo "no test reaches this change"; fi

      - name: cargo test --workspace --doc
        if: env.TRAIN != '1'
        run: /usr/bin/time -v cargo test --workspace --doc

      - name: cargo nextest run --features e2e-full (the full cohort, da-1wat)
        if: env.TRAIN != '1'
        run: |
          set -euo pipefail
          run=(/usr/bin/time -v cargo nextest run -p datum-commands --test e2e --features e2e-full --no-fail-fast --test-threads 3 --no-tests=pass)
          if [ -z "${TESTS:-}" ] || [ -e "$TESTS/FULL" ]; then "${run[@]}"
          elif [ -s "$TESTS/e2e-full.tests" ] || [ -s "$TESTS/new.tests" ]; then
            mapfile -t names < "$TESTS/e2e-full.tests"; mapfile -t new < "$TESTS/new.tests"
            "${run[@]}" "${new[@]}" -- --exact "${names[@]}"
          else echo "no test reaches this change"; fi

      - name: cargo xtask check lint (the honesty gates, da-8y2q.7)
        if: env.TRAIN != '1'
        run: cargo run -q -p xtask -- check lint

      # A red step above SKIPS the web suite (da-9qm64). Until then the web
      # chain ran after a cargo failure (da-vnebg: skipped reads as judged, and
      # the web result at that commit would not exist), which held a lane ~40
      # minutes for a run that was already red. vividn, 2026-09-24: «for
      # blocking CI do we have some sort of fail-fast option so that the CI
      # bails early rather than blocking a lane when it is going to fail
      # anyway?», then «yes both of the options for failing faster sound
      # good». da-vnebg's concern stays answered by a warning instead: the
      # step before the web chain says plainly that the web was NOT judged.
      # An `if:` with no status function means `success() && …`; the web
      # steps still test the step before them because a SKIPPED step (WEB=0)
      # is not a failure, and `success()` alone would run them.
      #
      # node 22 for the two capture scripts and the web suite. GitHub's job
      # uses setup-node's pnpm cache; there is no cache service here, so no
      # `cache:` — a cache that fails must not fail the gate.
      - uses: https://github.com/actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        id: node
        if: env.TRAIN != '1'
        with:
          node-version: 22

      # A PR runs only the web test files whose coverage reaches its change
      # (da-e0gtq): `testmap-web.json` on the `testmap` branch (testmap.yml),
      # read by web/scripts/testmap.mjs, picks the files that ran a function
      # of a changed web/src file or any of a changed tests/support module
      # (da-icb7g), every test file the PR adds or edits or the map does not
      # know, and those that read src/ or the build as data. The whole suite
      # instead, each reason printed, for any other change that can reach the
      # web (fixtures, config, static, a crate the CLI module is built from, a
      # kit, CI), a web/src or support file no test reached, a map missing or
      # over ten commits behind, or a selection that fails. A push runs
      # everything.
      - name: Which web tests can this change reach?
        if: env.WEB == '1' && github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: |
          set -uo pipefail
          sel="$RUNNER_TEMP/web-tests" map="$RUNNER_TEMP/testmap-web.json"
          git fetch -q origin +refs/heads/testmap:refs/remotes/origin/testmap &&
            git show origin/testmap:testmap-web.json > "$map" || { rm -f "$map"; echo "no web map on the testmap branch"; }
          node web/scripts/testmap.mjs select "$map" "origin/$BASE" "$sel" ||
            { mkdir -p "$sel"; echo "the selection failed" > "$sel/FULL"; echo "::warning::the web selection failed: every web test runs"; }
          echo "WEBTESTS=$sel" >> "$GITHUB_ENV"

      # Same gate as GitHub's build-and-test: the committed CLI-parity
      # fixtures are re-captured from target/debug/datum and must not move.
      - name: Re-capture the CLI-parity fixtures and compare with the committed copy
        if: env.TRAIN != '1'
        run: |
          set -euo pipefail
          git ls-files --error-unmatch web/tests/fixtures/cli-parity.json >/dev/null
          node web/scripts/capture-cli-fixtures.mjs
          if [ -n "$(git status --porcelain -- web/tests/fixtures)" ]; then
            git diff -- web/tests/fixtures
            echo "::error::web/tests/fixtures/cli-parity.json is out of date with the CLI. Fix: pnpm run test:fixtures && git add web/tests/fixtures"
            exit 1
          fi

      # The CLI's build.rs and the web's build-id.mjs spell one version: the two
      # must name this checkout alike (da-cv118).
      - name: The CLI and datum.day give the same version for this checkout
        if: env.TRAIN != '1'
        run: |
          cli=$(target/debug/datum --version); web=$(node web/scripts/build-id.mjs)
          echo "cli: $cli"; echo "web: $web"
          [ "$cli" = "$web" ] || { echo "::error::datum --version and web/scripts/build-id.mjs disagree"; exit 1; }

      # ── wasm ──────────────────────────────────────────────────────────────
      # The module is not committed (da-0qa4x), so there is nothing to compare
      # with: ensure-wasm.mjs builds it from this tree's crates — the pinned
      # wasi-sdk and binaryen (~100 MB, sha256-checked, uncached here) into
      # target/toolchains/ — or, when they are the merge-base's, fetches the
      # `wasm` branch's module for them. `pnpm test`'s build keeps it.
      - name: Build the CLI module (or fetch it, for a PR whose crates are main's)
        if: ${{ env.WEB == '1' }}
        run: /usr/bin/time -v node web/scripts/ensure-wasm.mjs

      # ── web ───────────────────────────────────────────────────────────────
      # Here, not before setup-node: the fixture compare and the wasm steps
      # above skip the web suite too when they fail.
      - name: Say the web suite was NOT RUN
        if: ${{ failure() }}
        run: |
          echo "::warning::web suite NOT RUN: a step above failed — this run says nothing about the web"

      # pnpm's version comes from web/package.json's packageManager field;
      # package_json_file is repo-root-relative because an action's inputs
      # ignore working-directory.
      - uses: https://github.com/pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        id: pnpm
        if: ${{ env.WEB == '1' }}
        with:
          package_json_file: web/package.json

      - name: pnpm install
        id: install
        if: ${{ steps.pnpm.outcome == 'success' }}
        working-directory: web
        run: pnpm install --frozen-lockfile

      # apt inside the job container; the image runs as root, so --with-deps
      # works (it did in task 184).
      - name: Install the headless browser
        id: browser
        if: ${{ steps.install.outcome == 'success' }}
        working-directory: web
        run: pnpm exec playwright install --with-deps --only-shell chromium

      # Last, so the browser peak never overlaps the link peak. FOUR files at
      # a time (da-gimld, below). History: at 1, run 800's pnpm test was 46:47,
      # green. At 3, runs 832 and 838 (2026-09-24) were ~35 min and both RED on
      # timing, not
      # code — a TAU throw, a cut tests/shell.test.mjs, four reachable.test.mjs
      # phone sizes — so it went to 2 (vividn 2026-09-24 17:35: «drop to 2, but
      # also harden the timing sensitive tests»). The hardening landed as
      # da-31464 (#157). Back at 3 (da-3u2m4), three runs at one head were
      # green with nothing cut: 1523, 1531, 1536. They took 41:01, 34:51 and
      # 25:04. A run's wall swings ~3x in a day at a fixed setting (at 2:
      # 18:13 to 56:19), so compare runs on the box at the same time. There,
      # 3 took 2461 s against 3186-3379 s for the runs at 2 beside it, at the
      # same CPU per run (~6200-6500 s): a run at 2 used ~2 cores
      # (187-198%), a run at 3 2.65-3.6. The box's cores are split evenly
      # across its lanes, ~3 each (the mayor, 2026-09-30), so at 2 the suite
      # left part of its own share idle, and at 3 it takes about its share.
      # It is not more throughput for the box. On a quiet box no gain showed,
      # and the one run at 3 cost more CPU (5380 s, against 3161-4724 s at 2).
      # The mayor's condition, amended 2026-10-01: a timing cut at 3 ON THE CI
      # BOX means back to 2 at once. By host: the 12-core CI box ran 3 files
      # green 4 of 4 times (1546, 1552, 1553, 1556); the only misses were on
      # the 3-core forge lane: 1548 at 3 files (daystrip cut at 300 s) and 1561
      # at 2 (a bar.test wall-clock miss). The host failed, not the file count.
      # Read which files a run cuts BY NAME. `availableParallelism()` in the
      # job reports the host's 12 cores and its load the host's, so the
      # scaler cannot pick this.
      # The override is capped at the cores less two (da-dwq7g), so a job
      # placed on the 3-core forge lane runs 1 file, and that lane is safe to
      # turn back on; a timing cut at 3 ON THE CI BOX still means back to 2.
      # FOUR on the 6-core lanes (da-gimld): at 3 the three file slots were
      # full the whole run (run 5177: 4107 s of file walls / 3 = its 1369 s
      # wall) while the lane used 359% of its six cores, so the wall moves
      # only by a fourth file at once. Kept if the wall drops beyond
      # ci-compare's noise with no new flake over three staging runs.
      - name: pnpm test
        if: ${{ steps.browser.outcome == 'success' }}
        working-directory: web
        # Longest first by the testmap run's times, which cover every file
        # (da-gqwh2); the committed durations.json when there are none. Then
        # the PR's selection, if one was made.
        run: |
          set -euo pipefail
          git fetch -q origin +refs/heads/testmap:refs/remotes/origin/testmap 2>/dev/null &&
            git show origin/testmap:web-durations.json > "$RUNNER_TEMP/durations.json" 2>/dev/null &&
            cp "$RUNNER_TEMP/durations.json" scripts/durations.json && echo "durations: the testmap branch's" ||
            echo "durations: the committed scripts/durations.json"
          if [ -n "${WEBTESTS:-}" ] && [ ! -e "$WEBTESTS/FULL" ]; then
            [ -s "$WEBTESTS/web.tests" ] || { echo "no web test reaches this change"; exit 0; }
            export DATUM_TEST_ONLY="$WEBTESTS/web.tests"
          fi
          /usr/bin/time -v pnpm test
        env:
          DATUM_TEST_CONCURRENCY: 4
          # A PR skips the staging-only tests, which name the reason in its
          # log; every push and dispatch runs them (da-v7y8x, vividn
          # 2026-10-19: «staging only»). Today that is the double-outline
          # sweep, `support/taps.mjs`: 151 s over the six act-taps files.
          DATUM_TEST_PR: ${{ github.event_name == 'pull_request' && '1' || '' }}
          # Known flakes get ONE retry, logged as `RETRIED web/tests/<file>
          # (<bead>): …`; no other file is ever retried (da-8bmqe). An entry
          # needs evidence that the TEST is at fault, not the diff: a red on a
          # staging run, or reds on three or more PRs whose diffs can't reach
          # the test. Each entry names its bead, and comes off when that
          # bead's fix lands. (daystrip-height, daystrip: the second kind,
          # 2026-10-15.) It is one `tests/<file>=<bead>` line appended at the
          # list's end (under `>-`), and taking it off is part of that bead's
          # acceptance: a retry left behind a closed bead hides any regression
          # in exactly that file (da-pzq4s emptied three, da-ehpe5 and
          # da-i1ok's).
          DATUM_TEST_RETRY: ""

      # A PR's verdict names the base it was reached on (da-kz73u): the forge's
      # own status says only pass or fail, at the head. Mirrors the job's
      # outcome, so it never turns a red run green or a green one red.
      - name: Post the base this verdict was reached on
        if: always() && env.BASE_SHA != ''
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
          STATE: ${{ job.status }}
          BASE: ${{ github.base_ref }}
        run: |
          case "$STATE" in success|failure) ;; *) echo "job $STATE: no status posted"; exit 0 ;; esac
          printf '{"state":"%s","context":"ci/base","description":"%s with %s@%s","target_url":"%s"}' \
            "$STATE" "$STATE" "$BASE" "${BASE_SHA:0:12}" "${SERVER%/}/${{ github.repository }}/actions/runs/${{ github.run_number }}" > /tmp/status.json
          printf 'header = "Authorization: token %s"\n' "$TOKEN" |
            curl -sSf -K - -H 'Content-Type: application/json' --data @/tmp/status.json \
              "${SERVER%/}/api/v1/repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }}" >/dev/null ||
            echo "::warning::could not post ci/base ($STATE with $BASE@$BASE_SHA)"
