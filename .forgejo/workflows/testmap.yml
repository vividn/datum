# The test map (da-fnt3v): which tests reach which functions, read by ci.yml
# on a PR to run only the tests its change can reach (`cargo xtask testmap
# select`). Built from staging's tip by one instrumented run of the suite
# (scripts/testmap-build.sh) and kept on the `testmap` branch: ONE orphan
# commit, force-pushed, holding `testmap.json`, whose `commit` is the staging
# sha it maps. Only the newest map is worth having, so there is no history.
# The `web` job puts the web suite's map beside it (da-e0gtq): one
# instrumented run of `pnpm test` (web/scripts/testmap.mjs), whose
# `testmap-web.json` ci.yml reads with `testmap.mjs select`, and whose
# `web-durations.json` is every file's seconds for the longest-first order
# (da-gqwh2). Each job pushes its own files and keeps the other's
# (scripts/testmap-push.sh).
#
# Its own workflow, so it never gates anything: a red or missing map makes a
# PR run its whole suite, saying so, and staging's verdict (ci.yml) never
# waits for it. A PR that changes the map's own machinery builds one too, to
# prove it, and pushes nothing.
name: testmap

on:
  push:
    branches: [staging]
  workflow_dispatch:
  pull_request:
    paths:
      - .forgejo/workflows/testmap.yml
      - scripts/testmap-*
      - xtask/src/testmap.rs
      - web/scripts/testmap.mjs
      - web/tests/support/coverage.mjs

# A staging build once started finishes (da-wqdmq): cancelled by each newer
# push, 7 of the 11 runs that ended between 22:31 and 00:08 on 10-15 mapped
# nothing. With `cancel-in-progress` false Forgejo queues every run of the
# group behind the one running, oldest first, and cancels none (QueueBehind,
# as ci.yml's staging runs do), so `newest` skips a run whose commit staging
# has moved past, and the run queued behind it maps the newer tip. A PR's
# run is still cancelled by the PR's next push.
concurrency:
  group: testmap-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/staging' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_BUILD_JOBS: 3

jobs:
  # ci.yml's tip read. An unreadable tip builds.
  newest:
    runs-on: ubuntu-latest
    outputs:
      superseded: ${{ steps.tip.outputs.superseded }}
    steps:
      - id: tip
        if: github.ref == 'refs/heads/staging'
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
        run: |
          set -uo pipefail
          tip=$(printf 'header = "Authorization: token %s"\n' "$TOKEN" | curl -sSf -K - "${SERVER%/}/api/v1/repos/${{ github.repository }}/branches/staging" |
            node -p 'JSON.parse(require("fs").readFileSync(0)).commit.id' 2>/dev/null) || tip=
          if [ -n "$tip" ] && [ "$tip" != "${{ github.sha }}" ]; then
            echo "staging has moved on to $tip, which the run queued behind this one maps"
            echo "superseded=true" >> "$GITHUB_OUTPUT"
          else
            echo "mapping ${{ github.sha }} (staging's tip: ${tip:-unread})"
          fi

  testmap:
    needs: newest
    if: needs.newest.outputs.superseded != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: System tools the image lacks (time, for max RSS per step)
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends time >/dev/null

      # ci.yml's install, under its lock (da-nmf83), plus llvm-tools: the
      # profiles are the toolchain's LLVM's, which no system LLVM reads.
      - name: Install rustup, the pinned toolchain and llvm-tools
        run: |
          set -euo pipefail
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          mkdir -p "$HOME/.cargo" && exec 9>"$HOME/.cargo/.ci-install.lock" && flock 9
          RUSTUP_AUTO_INSTALL=0 rustup --version >/dev/null 2>&1 ||
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none --profile minimal --no-modify-path
          rustup toolchain install --no-self-update
          rustup component add llvm-tools
          v=0.9.146
          if ! cargo nextest --version 2>/dev/null | grep -x "release: $v" >/dev/null; then
            tmp=$(mktemp -d "$HOME/.cargo/.nextest.XXXXXX")
            curl -LsSf "https://get.nexte.st/$v/linux" | tar zxf - -C "$tmp"
            mv "$tmp/cargo-nextest" "$HOME/.cargo/bin/cargo-nextest" && rmdir "$tmp"
          fi

      # The cost is the point of reading this log: wall time and max RSS,
      # against ci.yml's nextest steps on the same box.
      - name: Build the map
        run: /usr/bin/time -v scripts/testmap-build.sh "$RUNNER_TEMP/testmap.json" --test-threads 3

      - name: Commit it to `testmap`
        if: github.ref == 'refs/heads/staging' && github.event_name != 'pull_request'
        env:
          GIT_AUTHOR_NAME: testmap workflow
          GIT_AUTHOR_EMAIL: testmap@git.vividn.dev
          GIT_COMMITTER_NAME: testmap workflow
          GIT_COMMITTER_EMAIL: testmap@git.vividn.dev
        run: scripts/testmap-push.sh "$RUNNER_TEMP/testmap.json"

  web:
    needs: newest
    if: needs.newest.outputs.superseded != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      # The whole history, so ensure-wasm.mjs can find origin/main's
      # merge-base and fetch its module instead of building one.
      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: System tools the image lacks (time, for max RSS per step)
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends time >/dev/null

      # ci.yml's install, under its lock (da-nmf83), for a CLI module
      # ensure-wasm.mjs has to build and the native `datum` below.
      - name: Install rustup and the pinned toolchain
        run: |
          set -euo pipefail
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          mkdir -p "$HOME/.cargo" && exec 9>"$HOME/.cargo/.ci-install.lock" && flock 9
          RUSTUP_AUTO_INSTALL=0 rustup --version >/dev/null 2>&1 ||
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none --profile minimal --no-modify-path
          rustup toolchain install --no-self-update
          rustup target add wasm32-wasip1

      # The sync tests pair the page with a native copy (tests/support/sync.mjs).
      # Without one each fails at its first line, and the map holds only
      # that much of what it reaches.
      - name: Build the native datum the sync tests pair with
        run: /usr/bin/time -v cargo build -p datum-cli

      - uses: https://github.com/actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - uses: https://github.com/pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: web/package.json

      - name: pnpm install and the headless browser
        working-directory: web
        run: pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps --only-shell chromium

      # ci.yml's run, at its concurrency, with every file run to its end
      # (no fail-fast) and timed. A file that fails is still mapped by what
      # it ran; one cut before it finished is unknown to the map, so every
      # PR runs it.
      - name: Build the web map
        working-directory: web
        env:
          DATUM_TEST_CONCURRENCY: 3
          DATUM_TEST_BAIL: '0'
          DATUM_TEST_RECORD: '1'
        run: |
          set -euo pipefail
          export DATUM_TEST_COVERAGE="$RUNNER_TEMP/web-coverage"
          /usr/bin/time -v pnpm test || echo "::warning::the instrumented web run failed; the map holds what each file ran"
          node scripts/testmap.mjs index "$DATUM_TEST_COVERAGE" "$RUNNER_TEMP/testmap-web.json"
          cp scripts/durations.json "$RUNNER_TEMP/web-durations.json"

      - name: Commit it to `testmap`
        if: github.ref == 'refs/heads/staging' && github.event_name != 'pull_request'
        env:
          GIT_AUTHOR_NAME: testmap workflow
          GIT_AUTHOR_EMAIL: testmap@git.vividn.dev
          GIT_COMMITTER_NAME: testmap workflow
          GIT_COMMITTER_EMAIL: testmap@git.vividn.dev
        run: scripts/testmap-push.sh "$RUNNER_TEMP/testmap-web.json" "$RUNNER_TEMP/web-durations.json"
