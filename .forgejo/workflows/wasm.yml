# The `wasm` branch (da-0qa4x): datum-cli.wasm for every main commit, so the
# module can leave main. A committed binary cannot merge, and every CLI merge
# conflicted every other open CLI PR on that one file — eight at once on
# 2026-09-24. This is the gh-pages pattern: an artifact branch with linear
# history, one commit per main commit, `wasm for <sha>`, holding
#
#   datum-cli.wasm      the module
#   datum-sync.js       the sync worker's module, its glue and types (da-6kpj5)
#   datum-sync.d.ts
#   datum-sync_bg.wasm
#   SOURCE              the full main sha they are for
#
# `web/scripts/ensure-wasm.mjs` is what reads the branch: locally, in CI, in
# GitHub's deploy, and here — where a main commit whose crate inputs an
# earlier one shares reuses its bytes (they are reproducible) instead of
# building for minutes, and Rust is installed only when a build is needed.
#
# It no longer gates a deploy (da-causk): .github/workflows/deploy.yml runs
# on the push to main and fetches or builds the module itself, so a deploy
# never waits for this job's lane.
name: wasm

on:
  push:
    branches: [main]

# Only the newest main commit is worth a module: SOURCE names the commit, and
# ensure-wasm reuses a module for any later commit with the same crates.
concurrency:
  group: wasm
  cancel-in-progress: true

jobs:
  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Full history: ensure-wasm compares crate inputs against the SOURCE
      # of earlier `wasm` commits. The persisted job token is also what the
      # push below uses (write on its own repo, as on #134).
      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: https://github.com/actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Reuse an earlier module, or build one
        run: |
          set -euo pipefail
          node web/scripts/ensure-wasm.mjs --fetch-only && exit 0 || [ $? = 2 ]
          # ci.yml's install, under its lock and only when missing: this job
          # shares the runner's /root/.cargo with CI's (da-nmf83).
          export PATH="$HOME/.cargo/bin:$PATH"
          (
            mkdir -p "$HOME/.cargo" && exec 9>"$HOME/.cargo/.ci-install.lock" && flock 9
            RUSTUP_AUTO_INSTALL=0 rustup --version >/dev/null 2>&1 ||
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none --profile minimal --no-modify-path
            rustup toolchain install --no-self-update
            rustup target add wasm32-wasip1
          )
          node web/scripts/ensure-wasm.mjs

      # Plumbing, so the checkout is never touched: a tree of five blobs,
      # parented on the branch's tip as fetched just now.
      - name: Commit it to `wasm`
        env:
          GIT_AUTHOR_NAME: wasm workflow
          GIT_AUTHOR_EMAIL: wasm@git.vividn.dev
          GIT_COMMITTER_NAME: wasm workflow
          GIT_COMMITTER_EMAIL: wasm@git.vividn.dev
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          export GIT_INDEX_FILE=$(mktemp -u)
          git read-tree --empty
          add() { git update-index --add --cacheinfo "100644,$1,$2"; }
          for f in datum-cli.wasm datum-sync.js datum-sync.d.ts datum-sync_bg.wasm; do
            add "$(git hash-object -w "web/src/lib/wasm/$f")" "$f"
          done
          add "$(echo "$sha" | git hash-object -w --stdin)" SOURCE
          tree=$(git write-tree)
          git fetch -q origin +refs/heads/wasm:refs/remotes/origin/wasm || true
          parent=()
          tip=$(git rev-parse -q --verify refs/remotes/origin/wasm) && parent=(-p "$tip")
          commit=$(git commit-tree "$tree" "${parent[@]}" -m "wasm for $sha")
          git push origin "$commit:refs/heads/wasm"
          echo "wasm $commit: $(git show "$commit:SOURCE")"
          git ls-tree -r -l "$commit"
